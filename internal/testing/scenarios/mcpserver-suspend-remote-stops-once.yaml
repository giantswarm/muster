name: "mcpserver-suspend-remote-stops-once"
description: "A suspended remote MCPServer is stopped once: the resync ticks that follow find it Disconnected and are silent -- no further Suspending line, no further MCPServerStopped event -- and spec.suspended=false still starts it (#1212)"
category: "behavioral"
concept: "mcpserver"
tags: ["mcpserver", "lifecycle", "suspend", "reconciler", "regression", "issue-1212"]
timeout: "3m"

# Given: a remote (streamable-http) MCP server, Connected. The harness runs
#        muster with a 2 s reconciler resync (production: 30 s).
# When:  spec.suspended is set to true.
# Then:  the reconciler stops the service once; the stop of a remote server
#        settles in Disconnected, never Stopped.
# When:  more than two resync ticks pass.
# Then:  the server is still Disconnected; the reconciler logged exactly one
#        "Suspending MCPServer service ..." line, the orchestrator stopped the
#        service exactly once and exactly one MCPServerStopped event was
#        generated for it.
# When:  spec.suspended is set back to false.
# Then:  the service is started again and its tool answers.
#
# Before the fix reconcileSuspend returned early only for Stopped and Stopping.
# A remote server in Disconnected was stopped again on every tick: Service.Stop
# took its "not in a stoppable state" branch, re-set Disconnected and emitted
# MCPServerStopped -- two lifecycle log lines, one Kubernetes event and one
# state-change reconcile every 30 s for as long as the server stayed suspended
# (giantswarm/muster#1212). Here the occurrence counts at the end would read 3
# or more.
#
# There is no sleep step: the wait is a call to a tool on a second mock server
# whose answer is delayed by 5 s, longer than two resync ticks. That server is
# separate from the one under test so nothing stops or restarts it, and the
# scenario has no cleanup stop: core_service_stop is the imperative path in
# filesystem mode and would add a second MCPServerStopped for the server.

pre_configuration:
  main_config:
    config:
      events: true

  mcp_servers:
    - name: "suspend-once-server"
      config:
        type: "streamable-http"
        tools:
          - name: "probe"
            description: "Answers when the server is connected"
            input_schema:
              type: "object"
              properties: {}
            responses:
              - response: { alive: true }
    - name: "suspend-once-clock"
      config:
        type: "streamable-http"
        tools:
          - name: "wait"
            description: "Answers after more than two resync ticks"
            input_schema:
              type: "object"
              properties: {}
            responses:
              - response: { waited: "5s" }
                delay: "5s"

steps:
  - id: "connected"
    tool: "core_service_status"
    args:
      name: "suspend-once-server"
    expected:
      success: true
      wait_for_state: "30s"
      json_path:
        state: "connected"
    timeout: "45s"

  - id: "suspend"
    description: "spec.suspended=true; the reconciler stops the service"
    tool: "core_mcpserver_update"
    args:
      name: "suspend-once-server"
      type: "streamable-http"
      autoStart: true
      suspended: true
    expected:
      success: true
    timeout: "15s"

  - id: "disconnected"
    description: "The stop of a remote server settles in Disconnected, not Stopped"
    tool: "core_service_status"
    args:
      name: "suspend-once-server"
    expected:
      success: true
      wait_for_state: "30s"
      json_path:
        state: "disconnected"
    timeout: "45s"

  - id: "stopped-event"
    tool: "core_events"
    args:
      resourceType: "MCPServer"
      resourceName: "suspend-once-server"
    expected:
      success: true
      wait_for_state: "20s"
      contains: ["MCPServerStopped"]
    timeout: "30s"

  - id: "two-resync-ticks-pass"
    description: "5 s on a 2 s resync: at least two ticks reconcile the suspended server meanwhile"
    tool: "x_suspend-once-clock_wait"
    args: {}
    expected:
      success: true
      contains: ["waited"]
    timeout: "30s"

  - id: "still-disconnected"
    tool: "core_service_status"
    args:
      name: "suspend-once-server"
    expected:
      success: true
      json_path:
        state: "disconnected"
    timeout: "15s"

  - id: "still-suspended-in-spec"
    tool: "core_mcpserver_get"
    args:
      name: "suspend-once-server"
    expected:
      success: true
      json_path:
        suspended: true
    timeout: "15s"

  - id: "resume"
    description: "spec.suspended=false; the reconciler starts the service again (reconcileResume unchanged)"
    tool: "core_mcpserver_update"
    args:
      name: "suspend-once-server"
      type: "streamable-http"
      autoStart: true
      suspended: false
    expected:
      success: true
    timeout: "15s"

  - id: "connected-again"
    tool: "core_service_status"
    args:
      name: "suspend-once-server"
    expected:
      success: true
      wait_for_state: "30s"
      json_path:
        state: "connected"
    timeout: "45s"

  - id: "tool-answers-again"
    tool: "x_suspend-once-server_probe"
    args: {}
    expected:
      success: true
      wait_for_state: "20s"
      contains: ["alive"]
    timeout: "30s"

# The whole run: one suspension, one stop and one stopped event for the server
# -- the ticks in between left no trace -- and the resume happened. Before the
# fix every 2 s tick between "suspend" and "resume" added one of each.
instance_logs:
  occurrences:
    "Suspending MCPServer service suspend-once-server (spec.suspended=true)": 1
    "Stopped service: suspend-once-server": 1
    "Generated event MCPServerStopped for MCPServer service suspend-once-server": 1
  contains:
    - "Resuming MCPServer service suspend-once-server (spec.suspended=false)"
