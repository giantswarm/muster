name: "mcpserver-capability-follows-silent-redeploy"
description: "A remote MCPServer whose backend is redeployed with another tool set -- no CR change, and no list_changed from a process that has never seen muster's session -- has its tool list re-listed as soon as its connection meets the new process: the health probe's ping recovers the lost MCP session within one probe interval and the recovery re-lists the server, so the tool the new image dropped stops being served and the one it added becomes callable well before the capability poll (#494, #1440)"
category: "behavioral"
concept: "mcpserver"
tags: ["mcpserver", "streamable-http", "redeploy", "capabilities", "recovery", "clock", "issue-494", "issue-1440"]
timeout: "3m"

# Given: a remote streamable-http MCP server without auth, Connected, with one
#        tool. The instance runs on production intervals: the health probe
#        every 30 s and the capability poll every 5 min, both on the
#        controllable clock.
# When:  the backend is redeployed with an image that offers another tool set:
#        `probe` is gone, `report` is new. A fresh process takes over behind
#        the same port; it knows no session and sends no
#        notifications/tools/list_changed -- nobody it knows is connected.
# Then:  until something meets the new process, muster serves the list of
#        the old one: `report` is unknown. The next health probe does: its
#        ping is refused for the old session, the client re-initialises, and
#        the recovered session re-lists the server. `report` answers, `probe`
#        is no longer a tool, the server was connected throughout, and the
#        capability poll -- the catch-all for a backend that keeps no
#        session -- is still minutes away.

pre_configuration:
  intervals: "production"
  mcp_servers:
    - name: "rolled-server"
      config:
        type: "streamable-http"
        tools:
          - name: "probe"
            description: "Offered by the image before the roll"
            input_schema:
              type: "object"
              properties: {}
            responses:
              - response: { alive: true }

steps:
  - id: "connected"
    tool: "core_service_status"
    args:
      name: "rolled-server"
    expected:
      success: true
      wait_for_state: "30s"
      json_path:
        state: "connected"
    timeout: "45s"

  - id: "probe-before-the-roll"
    tool: "x_rolled-server_probe"
    args: {}
    expected:
      success: true
      contains: ["alive"]
    timeout: "15s"

  - id: "backend-rolled-with-another-tool-set"
    description: "A fresh process behind the same port offering report instead of probe; it has never seen muster's session, so no list_changed goes out"
    tool: "test_redeploy_mock_server"
    args:
      server: "rolled-server"
      add_tools:
        - name: "report"
          description: "Offered by the image after the roll"
      remove_tools: ["probe"]
    expected:
      success: true
      contains: ["Redeployed mock server", "tools changed: +report -probe"]
    timeout: "15s"

  - id: "new-tool-unknown-before-anything-met-the-new-process"
    description: "muster still serves the list of the old process"
    tool: "x_rolled-server_report"
    args: {}
    expected:
      success: false
    timeout: "15s"

  - id: "health-probe-runs"
    description: "The health tick is due: the probe meets the 404 for the old session, the session is recovered, and the recovery re-lists the server"
    tool: "test_advance_clock"
    args:
      duration: "31s"
    expected:
      success: true
      contains: ["Advanced the clock by 31s"]

  - id: "new-tool-served-after-the-probe"
    tool: "x_rolled-server_report"
    args: {}
    expected:
      success: true
      wait_for_state: "30s"
      contains: ["report"]
    timeout: "45s"

  - id: "dropped-tool-gone-after-the-probe"
    tool: "x_rolled-server_probe"
    args: {}
    expected:
      success: false
    timeout: "15s"

  - id: "connected-throughout"
    tool: "core_service_status"
    args:
      name: "rolled-server"
    expected:
      success: true
      json_path:
        state: "connected"
        health: "healthy"
    timeout: "15s"

# The recovered session, not a notification and not the poll, re-listed the
# server.
instance_logs:
  contains:
    - "recovered a lost MCP session"
    - "Capability refresh (recovery): updated 1 tools for rolled-server"
  not_contains:
    - "Capability refresh (poll): updated 1 tools for rolled-server"
