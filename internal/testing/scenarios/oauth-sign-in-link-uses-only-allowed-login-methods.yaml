name: "oauth-sign-in-link-uses-only-allowed-login-methods"
category: "behavioral"
concept: "mcpserver"
description: |
  The sign-in check is as strong as the weakest connector it signs in
  through, so it uses a session's connector only when the operator lists it
  in dex.identityCheckConnectors. A session from an unlisted connector is
  checked through muster's configured connector, as before, and its subject
  cannot match there.

  1. Alice's forwarded token was issued through ldap; muster's connector is
     github and only azure-ad is allowed for the check.
  2. Alice signing in at the check is sent to github, gets another subject
     and is refused.
tags: ["oauth", "authentication", "security", "token-forwarding", "mcpserver"]
timeout: "3m"

pre_configuration:
  mock_oauth_servers:
    # muster's identity provider and the issuer of the portal's forwarded
    # tokens (Dex, trusted as an issuer), with a fixed connector.
    - name: "muster-idp"
      scopes: ["openid", "profile", "email"]
      auto_approve: true
      pkce_required: false
      token_lifetime: "1h"
      client_id: "muster-client"
      client_secret: "muster-secret"
      use_as_muster_oauth_server: true
      dex_connector_id: "github"
      dex_identity_check_connectors: ["azure-ad"]

    - name: "connector-idp"
      scopes: ["mcp:read"]
      auto_approve: true
      pkce_required: true
      token_lifetime: "1h"
      client_id: "connector-client"
      use_tls: true

  muster_broker:
    trusted_issuers:
      - oauth_server_ref: "muster-idp"
        subject_claim: "email"

  mcp_servers:
    - name: "connector"
      config:
        type: "streamable-http"
        oauth:
          required: true
          mock_oauth_server_ref: "connector-idp"
          scope: "mcp:read"
        tools:
          - name: "get_me"
            description: "The authenticated user"
            responses:
              - response:
                  login: "alice"

steps:
  - id: "server-registered"
    tool: "core_mcpserver_list"
    args: {}
    expected:
      success: true
      contains: ["connector"]
      wait_for_state: "30s"

  - id: mint-alice
    description: "Alice's portal token, issued through the ldap connector, which is not allowed for the check"
    tool: "test_mint_token"
    args: {typ: "at+jwt", server: "muster-idp", name: "alice", sub: "CgVhbGljZRIEbGRhcA", email: "alice@example.com", email_verified: true, azp: "portal"}
    expected: {success: true}

  - id: alice-connects
    tool: "test_reconnect_with_token"
    args: {token_ref: "alice"}
    expected:
      success: true
      wait_for_state: "30s"

  - id: alice-signs-in
    description: "Alice signs in at the check as herself; muster sends her to github, not ldap, so her subject does not match"
    tool: "test_simulate_oauth_callback"
    args:
      server: "connector"
      signed_in_with_user: "alice"
    expected:
      success: false
      contains:
        - "different account or login method"

  - id: alice-still-signed-out
    tool: "x_connector_get_me"
    args: {}
    expected:
      success: false
      error_contains: ["auth_required"]
