name: "dex-token-forward"
category: "behavioral"
concept: "mcpserver"
description: |
  A resource access token issued for muster authenticates the caller on /mcp
  without becoming a credential for another server. A backend that trusts
  the same issuer still receives no copy of that inbound bearer. Downstream
  authorization needs its own grant or an explicitly configured exchange.
tags: ["oauth", "obo", "token-forwarding", "aggregator", "data-plane"]
timeout: "2m"

pre_configuration:
  mock_oauth_servers:
    - name: "muster-idp"
      scopes: ["openid", "profile", "email", "groups"]
      auto_approve: true
      pkce_required: false
      token_lifetime: "1h"
      client_id: "muster-client"
      client_secret: "muster-secret"
      use_as_muster_oauth_server: true

    - name: "workload-idp"

  muster_broker:
    trusted_issuers:
      - oauth_server_ref: "workload-idp"

  mcp_servers:
    - name: "obo-backend"
      config:
        type: "streamable-http"
        oauth:
          required: true
          trust_issuer_ref: "workload-idp"
          forward_token: true
        tools:
          - name: "whoami"
            description: "Echoes the caller's forwarded token claims"
            echo_token: true
            responses:
              - response:
                  status: "ok"

steps:
  - id: "verify-backend-registered"
    description: "Backend is registered with muster"
    tool: "core_mcpserver_list"
    args: {}
    expected:
      success: true
      contains: ["obo-backend"]
      wait_for_state: "30s"

  - id: "mint-dex-obo-token"
    description: |
      Dex mints the on-behalf-of token itself: sub=human, act=agent,
      groups. muster plays no part in issuance.
    tool: "test_mint_token"
    args:
      server: "workload-idp"
      name: "obo-token"
      typ: "at+jwt"
      sub: "alice@giantswarm.io"
      email: "alice@giantswarm.io"
      email_verified: true
      groups: ["customer:giantswarm:team-ai"]
      act:
        sub: "agent:sre-agent"
    expected:
      success: true

  - id: "connect-as-agent"
    description: "Present the dex-issued OBO token as the bearer on /mcp"
    tool: "test_reconnect_with_token"
    args:
      token_ref: "obo-token"
    expected:
      success: true
      wait_for_state: "30s"

  - id: "backend-does-not-receive-resource-bearer"
    description: "The backend requires a separate authorization grant"
    tool: "x_obo-backend_whoami"
    args: {}
    expected:
      success: false
      not_contains:
        - "alice@giantswarm.io"
        - "agent:sre-agent"
