name: "mcpserver-kubernetes-boot-pass-and-reconciler-register-every-cr"
description: "Kubernetes mode with sixty MCPServer CRs -- twelve to start, 48 deactivated -- across five boots: the orchestrator's boot pass and the reconciler's first pass, which run concurrently and race to register the same definitions, register every CR once on every boot, every server connects, and the loser of the race never logs an ERROR (#1222, #1237)"
category: "behavioral"
concept: "mcpserver"
tags: ["mcpserver", "kubernetes", "envtest", "orchestrator", "reconciler", "boot", "regression", "issue-1222", "issue-1237"]
timeout: "5m"

# Given: sixty MCPServer CRs in the instance's namespace -- twelve remote
#        (streamable-http) servers with autoStart: true and 48 deactivated
#        ones (autoStart: false, nothing to connect to) -- and muster serve in
#        Kubernetes mode.
# When:  muster boots, and is restarted four times (test_restart_instance:
#        the CRs, their status included, stay; the process comes up on them
#        the way a rolled pod does). On every boot the reconcile manager
#        starts before the orchestrator; its informer delivers an add event
#        per CR and its workers register the services lazily through
#        StartService (a read, then a registration), while the orchestrator's
#        boot pass lists every CR once and registers them too. For a CR the
#        reconciler reached first, the boot pass finds it already registered.
# Then:  after every boot all twelve servers are listed and Connected and
#        their tools answer, and over the five boots the boot pass logged no
#        "Failed to create MCPServer service" -- a service it found registered
#        exists and is being started by the caller that registered it.
#
# Before the fix registry.Register refused the duplicate and the boot pass
# logged it as an ERROR per affected server per boot, "Failed to create
# MCPServer service: <name> ... service <name> already registered" -- two of
# 87 definitions on one installation running v5.19.7 -- for a service that was
# fine (giantswarm/muster#1222). The filesystem-mode suite never met the race:
# there the boot pass lists a directory in microseconds and the filesystem
# detector has no initial list to deliver. In Kubernetes mode the two passes
# run side by side and the reconciler wins a CR whenever its two single-object
# reads finish before the boot pass's one list of every CR returns. The 48
# deactivated CRs give that list an installation's size (both passes skip
# AutoStart=false, so they cost neither a start), and the five boots are five
# draws: with the list this size the reconciler wins at least one CR in about
# every second boot, so the ERROR the fix removes shows on the old binary in
# practically every run, while the scenario is deterministic on the fixed one
# (the line is never emitted, whichever pass wins).

