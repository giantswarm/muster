steps:
  - id: "every-cr-listed"
    description: "Both passes together registered all twelve active CRs, none twice, none missing"
    tool: "core_mcpserver_list"
    args: {}
    expected:
      success: true
      contains:
        - "race-cr-01"
        - "race-cr-02"
        - "race-cr-03"
        - "race-cr-04"
        - "race-cr-05"
        - "race-cr-06"
        - "race-cr-07"
        - "race-cr-08"
        - "race-cr-09"
        - "race-cr-10"
        - "race-cr-11"
        - "race-cr-12"
    timeout: "15s"

  - id: "first-connected-in-cr-status"
    tool: "test_get_cr"
    args:
      name: "race-cr-01"
    expected:
      success: true
      wait_for_state: "20s"
      json_path:
        status:
          state: "Connected"
    timeout: "30s"

  - id: "last-connected-in-cr-status"
    tool: "test_get_cr"
    args:
      name: "race-cr-12"
