# The whole run, five boots: sixty CRs found by the boot pass each time, no
# registration reported as a failure. Before the fix every CR the reconciler registered first produced
# one "Failed to create MCPServer service: race-cr-NN" ERROR line here. (The
# reconciler losing the race the other way round is a DEBUG line and a requeue,
# "Failed to start service ...: ... already registered", and is not asserted
# on: it is the race being taken, not a bug.)
instance_logs:
  occurrences:
    "Found 60 MCPServer definitions for auto-start processing": 5
  contains:
    - "Initialized reconciliation manager in kubernetes mode"
  not_contains:
    - "Failed to create MCPServer service"
