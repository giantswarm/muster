name: "oauth-dcr-reregister-after-as-forgets-client"
category: "behavioral"
concept: "mcpserver"
description: "DCR authorization server forgets muster's registration (in-memory client store restart): the next core_auth_login detects the dead client_id at the authorization endpoint and registers again instead of sending users into a browser 400"
tags: ["oauth", "authentication", "mcpserver", "dcr"]
timeout: "2m"

# The IdP registers muster via RFC 7591 and then loses its client registry —
# what a pro restart does: its clients live in an in-memory Map. Muster's
# stored credentials look perfectly valid (no expiry, never revoked through
# muster), yet every authorization request built with them is answered
# straight to the browser with 400 invalid_client, which muster never sees.
#
# Before issuing a sign-in link with stored DCR credentials muster therefore
# asks the authorization endpoint whether it still knows the client_id, drops
# the registration when the answer is invalid_client, and registers again —
# so the very next core_auth_login after the loss already works, without an
# operator deleting the Valkey entry by hand.
pre_configuration:
  mock_oauth_servers:
    - name: "forgetful-idp"
      scopes: ["openid", "profile", "mcp:read"]
      auto_approve: true
      pkce_required: true
      token_lifetime: "1h"
      supports_dcr: true
      require_registered_client: true

  mcp_servers:
    - name: "forgetful-protected-server"
      config:
        type: "streamable-http"
        oauth:
          required: true
          mock_oauth_server_ref: "forgetful-idp"
          scope: "mcp:read"
        tools:
          - name: "get_data"
            description: "Returns data that requires authentication"
            responses:
              - response:
                  data: "authenticated-data"

steps:
  - id: first-user-auth-challenge
    description: "First sign-in registers muster with the IdP via RFC 7591"
    tool: "core_auth_login"
    args:
      server: "forgetful-protected-server"
    expected:
      success: true
      contains:
        - "Authentication Required"

  - id: verify-first-registration
    description: "Exactly one registration, one known client"
    tool: "test_get_oauth_server_info"
    args:
      server: "forgetful-idp"
    expected:
      success: true
      json_path:
        dcr_registrations: 1
        dcr_registered_clients: 1

  - id: first-user-completes-login
    description: "The first user completes the flow with the registered client_id"
    tool: "test_simulate_oauth_callback"
    args:
      server: "forgetful-protected-server"
    expected:
      success: true
      contains:
        - "success"

  - id: first-user-connects
    description: "Establish the session connection with the stored token"
    tool: "core_auth_login"
    args:
      server: "forgetful-protected-server"
    expected:
      success: true

  - id: first-user-calls-tool
    description: "The protected tool works for the first user"
    tool: "x_forgetful-protected-server_get_data"
    args: {}
    expected:
      success: true
      contains:
        - "authenticated-data"

  - id: idp-forgets-registrations
    description: "The IdP restarts and forgets every registered client; muster's stored credentials are now dead"
    tool: "test_forget_oauth_registrations"
    args:
      server: "forgetful-idp"
    expected:
      success: true
      json_path:
        forgotten: 1
        dcr_registered_clients: 0

  - id: create-second-user
    description: "A second user arrives after the IdP restart"
    tool: "test_create_user"
    args:
      name: "second-user"
    expected:
      success: true

  - id: second-user-auth-challenge
    as_user: "second-user"
    description: "core_auth_login detects the dead client_id at the authorization endpoint and re-registers before issuing the sign-in link"
    tool: "core_auth_login"
    args:
      server: "forgetful-protected-server"
    expected:
      success: true
      contains:
        - "Authentication Required"

  - id: verify-reregistration
    description: "Muster registered again — the IdP knows one (new) client and has served two registrations"
    tool: "test_get_oauth_server_info"
    args:
      server: "forgetful-idp"
    expected:
      success: true
      json_path:
        dcr_registrations: 2
        dcr_registered_clients: 1

  - id: second-user-completes-login
    as_user: "second-user"
    description: "The flow completes — the strict token endpoint only accepts the new registration's client_id"
    tool: "test_simulate_oauth_callback"
    args:
      server: "forgetful-protected-server"
    expected:
      success: true
      contains:
        - "success"

  - id: verify-no-churn
    description: "A healthy registration is reused: the second user's callback flow did not register a third time"
    tool: "test_get_oauth_server_info"
    args:
      server: "forgetful-idp"
    expected:
      success: true
      json_path:
        dcr_registrations: 2
        dcr_registered_clients: 1

  - id: second-user-connects
    as_user: "second-user"
    description: "Establish the second user's session connection"
    tool: "core_auth_login"
    args:
      server: "forgetful-protected-server"
    expected:
      success: true

  - id: second-user-calls-tool
    as_user: "second-user"
    description: "The protected tool works for the second user after the self-healed registration"
    tool: "x_forgetful-protected-server_get_data"
    args: {}
    expected:
      success: true
      contains:
        - "authenticated-data"
