name: "sso-tokens-never-logged"
category: "behavioral"
concept: "mcpserver"
description: |
  A caller's credentials never reach muster's own logs. The scenario drives
  a resource bearer without backend authority and a browser authorization
  that establishes a provider ID token for SSO. With debug logging enabled,
  no JWT may appear in stdout or stderr.
tags: ["oauth", "sso", "logging", "security", "aggregator"]
timeout: "2m"

pre_configuration:
  mock_oauth_servers:
    - name: "muster-idp"
      scopes: ["openid", "profile", "email", "groups"]
      auto_approve: true
      pkce_required: false
      token_lifetime: "1h"
      client_id: "muster-client"
      client_secret: "muster-secret"
      use_as_muster_oauth_server: true

    - name: "workload-idp"

  muster_broker:
    trusted_issuers:
      - oauth_server_ref: "workload-idp"

  mcp_servers:
    - name: "obo-backend"
      config:
        type: "streamable-http"
        oauth:
          required: true
          trust_issuer_ref: "muster-idp"
          forward_token: true
        tools:
          - name: "whoami"
            description: "Echoes the caller's forwarded token claims"
            echo_token: true
            responses:
              - response:
                  status: "ok"

steps:
  - id: "verify-backend-registered"
    description: "Backend is registered with muster"
    tool: "core_mcpserver_list"
    args: {}
    expected:
      success: true
      contains: ["obo-backend"]
      wait_for_state: "30s"

  - id: "mint-dex-obo-token"
    description: "Dex mints the on-behalf-of token: sub=human, act=agent"
    tool: "test_mint_token"
    args:
      server: "workload-idp"
      name: "obo-token"
      typ: "at+jwt"
      sub: "alice@giantswarm.io"
      email: "alice@giantswarm.io"
      email_verified: true
      groups: ["customer:giantswarm:team-ai"]
      act:
        sub: "agent:sre-agent"
    expected:
      success: true

  - id: "connect-as-agent"
    description: |
      Present the dex-issued OBO token as the bearer on /mcp. This is the
      forwarded-token session bootstrap: initSSOForSession runs with the
      bearer in hand.
    tool: "test_reconnect_with_token"
    args:
      token_ref: "obo-token"
    expected:
      success: true
      wait_for_state: "30s"

  - id: "resource-bearer-is-not-forwarded"
    tool: "x_obo-backend_whoami"
    args: {}
    expected:
      success: false
      not_contains: ["alice@giantswarm.io", "agent:sre-agent"]

  - id: "browser-login"
    tool: "test_muster_auth_login"
    args: {subject: "alice@giantswarm.io"}
    expected: {success: true}

  - id: "backend-receives-provider-credential"
    description: "The granted provider identity authenticates the backend"
    tool: "x_obo-backend_whoami"
    args: {}
    expected:
      success: true
      wait_for_state: "30s"
      contains:
        - "alice@giantswarm.io"

# Evaluated once the steps above ran: muster serve's own stdout and stderr,
# captured at debug level for the whole scenario, never carried a credential:
# none of the values the mock authorization servers issued (codes, access,
# refresh and ID tokens), and no JWT, two dot-joined base64url segments that
# each encode a JSON object. A bare "eyJ" also matches random identifiers such
# as request IDs.
instance_logs:
  not_contains_issued_credentials: true
  not_matches: ['eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+']
