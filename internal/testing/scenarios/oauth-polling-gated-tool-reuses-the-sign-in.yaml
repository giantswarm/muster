    tool: "x_gh_whoami"
    args: {}
    expected:
      success: false
      error_contains: ["auth_required", "gh", "Please sign in"]
      not_contains: ["Rate limit exceeded"]

  - id: poll-6
    description: "Poll 6 answers the pending sign-in challenge"
    tool: "x_gh_whoami"
    args: {}
    expected:
      success: false
      error_contains: ["auth_required", "gh", "Please sign in"]
      not_contains: ["Rate limit exceeded"]

  - id: poll-7
    description: "Poll 7 answers the pending sign-in challenge"
    tool: "x_gh_whoami"
    args: {}
    expected:
      success: false
