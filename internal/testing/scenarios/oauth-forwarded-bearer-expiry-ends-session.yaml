name: "oauth-forwarded-bearer-expiry-ends-session"
category: "behavioral"
concept: "mcpserver"
description: |
  A session authenticated by a resource access token ends at that token's
  expiry. Its backend uses a separate authorization-code grant. At the outer
  token's exp muster closes the session's backend connections and the server
  returns to Auth Required. Capability polling never reuses the ended
  session, and the backend never receives an expired credential.
tags: ["oauth", "obo", "token-forwarding", "aggregator", "expiry", "poll", "issue-1323"]
timeout: "3m"

# Given: a backend with its own OAuth grant and an outer access token valid
#        for 45 seconds.
# When:  the token expires.
# Then:  muster ends the session at its exp (the server is Auth Required
#        again), and neither then nor on the capability poll five minutes on
#        does the backend receive a request with the expired token.

pre_configuration:
  intervals: "production"
  mock_oauth_servers:
    - name: "muster-idp"
      scopes: ["openid", "profile", "email"]
      auto_approve: true
      pkce_required: false
      token_lifetime: "45s"
      client_id: "muster-client"
      client_secret: "muster-secret"
      use_as_muster_oauth_server: true

    - name: "workload-idp"
      scopes: ["openid", "profile", "email"]
      auto_approve: true
      token_lifetime: "1h"
      client_id: "backend-client"

  muster_broker:
    trusted_issuers:
      - oauth_server_ref: "muster-idp"

  mcp_servers:
    - name: "expiring-backend"
      config:
        type: "streamable-http"
        oauth:
          required: true
          mock_oauth_server_ref: "workload-idp"
          forward_token: false
        tools:
          - name: "whoami"
            description: "Responds with the backend status"
            responses:
              - response:
                  status: "ok"

steps:
  - id: "backend-registered"
    tool: "core_mcpserver_list"
    args: {}
    expected:
      success: true
      contains: ["expiring-backend"]
      wait_for_state: "30s"

  - id: "mint-short-lived-agent-token"
    description: "A short-lived resource access token for muster"
    tool: "test_mint_token"
    args:
      server: "muster-idp"
      name: "agent-token"
      typ: "at+jwt"
      sub: "alice@example.com"
      email: "alice@example.com"
      email_verified: true
      act:
        sub: "agent:sre-agent"
    expected:
      success: true

  - id: "connect-as-agent"
    tool: "test_reconnect_with_token"
    args:
      token_ref: "agent-token"
    expected:
      success: true
      wait_for_state: "30s"

  - id: "authorize-backend"
    tool: "test_simulate_oauth_callback"
    args:
      server: "expiring-backend"
      signed_in_as: "alice@example.com"
    expected:
      success: true

  - id: "call-pools-the-backend-connection"
    tool: "x_expiring-backend_whoami"
    args: {}
    expected:
      success: true
      wait_for_state: "20s"
      contains: ["ok"]

  - id: "connected-while-the-token-lives"
    tool: "test_scrape_metrics"
    args:
      filter: "muster_mcpserver_state{"
    expected:
      success: true
      wait_for_state: "20s"
      contains:
        - 'mcpserver_name="expiring-backend"'
        - 'state="Connected"'

  - id: "session-ended-at-expiry"
    description: "At the token's exp muster closes the session's connection; the server waits for the next session"
    tool: "test_scrape_metrics"
    args:
      filter: "muster_mcpserver_state{"
    expected:
      success: true
      wait_for_state: "90s"
      contains:
        - 'mcpserver_name="expiring-backend"'
        - 'state="Auth Required"'

  - id: "capability-poll-after-expiry"
    description: "The poll re-lists through every pooled connection; the ended session holds none"
    tool: "test_advance_clock"
    args:
      duration: "5m"
    expected:
      success: true
      contains: ["Advanced the clock by 5m0s"]

  - id: "backend-never-saw-the-expired-token"
    tool: "test_get_mock_server_rejections"
    args:
      server: "expiring-backend"
    expected:
      success: true
      json_path:
        rejected_expired: 0

# The outer bearer limits the session independently of the backend grant.
instance_logs:
  contains:
    - "its resource bearer expired at"
    - "closed 1 backend connections"
  not_contains:
    - "using expired connection token"
    - "evicting stale connection"
    - "Capability poll: re-listing"
