name: "list-tools-paged"
description: "list_tools answers one bounded, summarised page of the caller's catalogue — 50 tools by default with total and truncated set — limit/offset page through the rest, descriptions are one-line summaries with the full text behind describe_tool, and a header-declared toolset (X-Muster-Toolset) still bounds the listing while preset:none lists nothing (#1193)"
category: "behavioral"
concept: "mcpserver"
tags: ["metatools", "list_tools", "paging", "toolset", "1193"]
timeout: "5m"

# Given: a mock server with 55 tools — more than the default page — one of
#        them with a two-line description, next to muster's core tools.
# When:  list_tools is called without arguments, with limit/offset, and with
#        X-Muster-Toolset: server:pager / preset:none.
# Then:  the default answer is one page of 50 summarised entries that says it
#        is truncated and how many tools there are; the following pages are
#        reached with offset; the second description line appears only in
#        describe_tool, which also states that the tool is invoked through
#        call_tool; the toolset bounds total and the page alike; invalid
#        paging arguments are refused like filter_tools refuses them.

pre_configuration:
  mcp_servers:
    - name: "pager"
      config:
        tools:
          - name: "t01"
            description: "Pager tool 01.\nFULLDETAILONLY this second line documents every edge case and must never leak into a listing."
            responses: [{ response: { ok: true } }]
          - { name: "t02", description: "Pager tool 02", responses: [{ response: { ok: true } }] }
          - { name: "t03", description: "Pager tool 03", responses: [{ response: { ok: true } }] }
