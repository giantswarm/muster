steps:
  - id: "wait-for-server"
    tool: "core_mcpserver_list"
    args: {}
    expected:
      success: true
      wait_for_state: "30s"
      contains: ["pager"]

  - id: "default-page-is-bounded"
    description: "no arguments: one page of 50 summarised entries, truncated, with the catalogue size"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools" }
    expected:
      success: true
      wait_for_state: "20s"
      json_path:
        filters.limit: 50
        filters.offset: 0
        filtered_count: 50
        truncated: true
      contains: ["total", "total_tools", "summary", "truncated"]
      not_contains: ["FULLDETAILONLY", "inputSchema"]

  - id: "explicit-page"
    description: "limit bounds the page explicitly"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools", arguments: { limit: 2 } }
    expected:
      success: true
      json_path:
        filters.limit: 2
        filtered_count: 2
        truncated: true

  - id: "offset-moves-the-page"
    description: "offset skips into the catalogue; the page after the last one is empty and not truncated"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools", arguments: { limit: 2, offset: 2 } }
    expected:
      success: true
      json_path:
        filters.limit: 2
        filters.offset: 2
        filtered_count: 2

  - id: "large-limit-is-the-whole-catalogue"
    description: "a client that wants every tool asks for a large page and gets an untruncated answer"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools", arguments: { limit: 1000 } }
    expected:
      success: true
      json_path:
        truncated: false
      contains: ["x_pager_t01", "x_pager_t55", "core_workflow_list"]

  - id: "toolset-bounds-the-catalogue"
    description: "X-Muster-Toolset narrows the catalogue to the server's 55 tools; the page still bounds the answer"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools" }
    headers: { X-Muster-Toolset: "server:pager" }
    expected:
      success: true
      json_path:
        total: 55
        total_tools: 55
        filtered_count: 50
        truncated: true
        toolset.0: "server:pager"
        tools.0.name: "x_pager_t01"
        tools.0.summary: "Pager tool 01."
        tools.0.server: "pager"
        tools.0.kind: "tool"
        tools.49.name: "x_pager_t50"
      not_contains: ["core_workflow_list", "FULLDETAILONLY", "x_pager_t51"]

  - id: "toolset-second-page"
    description: "offset reaches the rest of the toolset; the last page is not truncated"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools", arguments: { offset: 50 } }
    headers: { X-Muster-Toolset: "server:pager" }
    expected:
      success: true
      json_path:
        total: 55
        filtered_count: 5
        truncated: false
        tools.0.name: "x_pager_t51"
        tools.4.name: "x_pager_t55"
      not_contains: ["x_pager_t50", "core_workflow_list"]

  - id: "toolset-large-limit"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools", arguments: { limit: 100 } }
    headers: { X-Muster-Toolset: "server:pager" }
    expected:
      success: true
      json_path:
        filtered_count: 55
        truncated: false

  - id: "preset-none-lists-nothing"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools" }
    headers: { X-Muster-Toolset: "preset:none" }
    expected:
      success: true
      json_path:
        total: 0
        total_tools: 0
        filtered_count: 0
        truncated: false
        toolset.0: "preset:none"
      not_contains: ["x_pager", "core_workflow_list"]

  - id: "describe-tool-has-the-full-text"
    description: "the full description stays behind describe_tool, which also states that the tool is reached through call_tool and never by its own name"
    tool: "test_call_meta_tool"
    args: { tool: "describe_tool", arguments: { name: "x_pager_t01" } }
    expected:
      success: true
      contains:
        - "FULLDETAILONLY"
        - "inputSchema"
        - 'Call it through the call_tool meta-tool: call_tool{"name": "x_pager_t01", "arguments": <object matching inputSchema>}'
        - "not callable by name directly"

  - id: "limit-below-one-refused"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools", arguments: { limit: 0 } }
    expected:
      success: false
      error_contains: ["limit must be at least 1"]

  - id: "negative-offset-refused"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools", arguments: { offset: -1 } }
    expected:
      success: false
      error_contains: ["offset must be at least 0"]

  - id: "unknown-preset-refusal-unchanged"
    tool: "test_call_meta_tool"
    args: { tool: "list_tools", arguments: { limit: 5 } }
    headers: { X-Muster-Toolset: "preset:foo" }
    expected:
      success: false
      error_contains: ['toolset [preset:foo] names unknown preset "foo"; known presets: read-only, none, full']
