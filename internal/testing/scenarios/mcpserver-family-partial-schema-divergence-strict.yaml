name: "mcpserver-family-partial-schema-divergence-strict"
description: "When one member's input schema for a tool differs within a family, ONLY that member falls back to per-server prefixing for that tool; the other members keep the family-prefixed name"
category: "behavioral"
concept: "mcpserver"
tags: ["mcpserver", "family", "aggregator", "fallback"]
timeout: "2m"

# Given: Three MCP servers share family.name=kubernetes. They expose two
#        tools: list_pods (same schema everywhere) and delete_pod, whose
#        input schema on k8s-b carries an extra argument.
# When:  The aggregator lists tools.
# Then:  - list_pods groups as x_kubernetes_list_pods across all three
#        - delete_pod groups as x_kubernetes_delete_pod across k8s-a and k8s-c
#          (the largest schema group), and k8s-b exposes it only as
#          x_k8s-b_delete_pod: x_kubernetes_delete_pod does not route to k8s-b.

pre_configuration:
  mcp_servers:
    - name: "k8s-a"
      config:
        family:
          name: "kubernetes"
          instanceArg: "management_cluster"
        tools:
          - name: "list_pods"
            description: "List pods in a namespace"
            input_schema:
              type: "object"
              properties:
                namespace: { type: "string" }
            responses:
              - response: { source: "k8s-a" }
          - name: "delete_pod"
            description: "Delete pod (idempotent)"
            input_schema:
              type: "object"
              properties:
                namespace: { type: "string" }
                name:      { type: "string" }
            responses:
              - response: { source: "k8s-a" }
    - name: "k8s-b"
      config:
        family:
          name: "kubernetes"
          instanceArg: "management_cluster"
        tools:
          - name: "list_pods"
            description: "List pods in a namespace"
            input_schema:
              type: "object"
              properties:
                namespace: { type: "string" }
            responses:
              - response: { source: "k8s-b" }
          - name: "delete_pod"
            description: "Delete pod (idempotent)"
            input_schema:                                   # diverges: extra argument
              type: "object"
              properties:
                namespace: { type: "string" }
                name:      { type: "string" }
                force:     { type: "boolean" }
            responses:
              - response: { source: "k8s-b" }
    - name: "k8s-c"
      config:
        family:
          name: "kubernetes"
          instanceArg: "management_cluster"
        tools:
          - name: "list_pods"
            description: "List pods in a namespace"
            input_schema:
              type: "object"
              properties:
                namespace: { type: "string" }
            responses:
              - response: { source: "k8s-c" }
          - name: "delete_pod"
            description: "Delete pod (idempotent)"
            input_schema:
              type: "object"
              properties:
                namespace: { type: "string" }
                name:      { type: "string" }
            responses:
              - response: { source: "k8s-c" }

steps:
  - id: "wait-for-a"
    tool: "core_service_status"
    args:
      name: "k8s-a"
    expected:
      success: true
      wait_for_state: "30s"
      json_path:
        state: "running"

  - id: "wait-for-b"
    tool: "core_service_status"
    args:
      name: "k8s-b"
    expected:
      success: true
      wait_for_state: "30s"
      json_path:
        state: "running"

  - id: "wait-for-c"
    tool: "core_service_status"
    args:
      name: "k8s-c"
    expected:
      success: true
      wait_for_state: "30s"
      json_path:
        state: "running"

  # Same schema everywhere: list_pods groups across all three.
  - id: "matching-tool-groups-a"
    tool: "x_kubernetes_list_pods"
    args:
      management_cluster: "k8s-a"
      namespace: "default"
    expected:
      success: true
      contains: ["k8s-a"]

  - id: "matching-tool-groups-b"
    tool: "x_kubernetes_list_pods"
    args:
      management_cluster: "k8s-b"
      namespace: "default"
    expected:
      success: true
      contains: ["k8s-b"]

  - id: "matching-tool-groups-c"
    tool: "x_kubernetes_list_pods"
    args:
      management_cluster: "k8s-c"
      namespace: "default"
    expected:
      success: true
      contains: ["k8s-c"]

  # Same schema on k8s-a and k8s-c: they keep the family name.
  - id: "schema-group-keeps-family-name-a"
    tool: "x_kubernetes_delete_pod"
    args:
      management_cluster: "k8s-a"
      namespace: "default"
      name:      "pod-1"
    expected:
      success: true
      contains: ["k8s-a"]

  - id: "schema-group-keeps-family-name-c"
    tool: "x_kubernetes_delete_pod"
    args:
      management_cluster: "k8s-c"
      namespace: "default"
      name:      "pod-3"
    expected:
      success: true
      contains: ["k8s-c"]

  # k8s-b's schema differs: it falls back to its per-server name.
  - id: "diverging-member-per-server-b"
    tool: "x_k8s-b_delete_pod"
    args:
      namespace: "default"
      name:      "pod-2"
      force:     true
    expected:
      success: true
      contains: ["k8s-b"]

  - id: "diverging-member-not-under-family-name"
    description: "x_kubernetes_delete_pod must not route to k8s-b, whose input schema differs"
    tool: "x_kubernetes_delete_pod"
    args:
      management_cluster: "k8s-b"
      namespace: "default"
      name:      "pod-2"
    expected:
      success: false
      error_contains: ["k8s-b"]

cleanup:
  - id: "cleanup-stop-a"
    tool: "core_service_stop"
    args:
      name: "k8s-a"
    expected:
      success: true
    continue_on_failure: true
  - id: "cleanup-stop-b"
    tool: "core_service_stop"
    args:
      name: "k8s-b"
    expected:
      success: true
    continue_on_failure: true
  - id: "cleanup-stop-c"
    tool: "core_service_stop"
    args:
      name: "k8s-c"
    expected:
      success: true
    continue_on_failure: true
