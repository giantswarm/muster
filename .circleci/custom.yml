# Repo-specific CircleCI jobs. The dynamic-config setup workflow in
# .circleci/config.yml deep-merges this file into the generated
# .circleci/workflows.yml at pipeline runtime (yq `*+`: maps merge, job lists
# append). devctl never touches this file.
#
# Generated job names referenced in `requires` below: go-build,
# push-to-registries-release, execute-chart-tests.
#
# What this file carries beyond the golden pipeline:
#   - branch dev-image push (the golden pipeline only builds + tests on branches)
#   - branch dev-chart push for the muster chart
#   - the standalone muster-crds chart (build, ATS tests, branch + tag push),
#     versioned in lockstep with muster off the same git tag
#   - the envtest-backed RBAC integration job (test-envtest), which needs a
#     real kube-apiserver from setup-envtest -- the generated go-build job
#     only runs `make test`, so TestWritesAsCallerEnvtest self-skips there
#     without KUBEBUILDER_ASSETS
#   - the chart test job (chart-test), which runs the helm-unittest suites and
#     the promtool alert-rule tests. Neither is reachable from `make test`:
#     both need helm plugins and promtool, which the architect go image does
#     not carry.
version: 2.1

jobs:
  # `make test` (run by the generated go-build job) doesn't set
  # KUBEBUILDER_ASSETS, so TestWritesAsCallerEnvtest (added in #1060) self-skips
  # via t.Skip() there. This job runs `make test-envtest`, which downloads a
  # real kube-apiserver via setup-envtest and points KUBEBUILDER_ASSETS at it,
  # so the RBAC integration test actually executes. Reuses the same
  # `architect` image/context as go-build -- no extra module auth needed since
  # github.com/giantswarm/muster and its Go module deps are public repos.
  test-envtest:
    executor: architect/architect
    resource_class: medium
    steps:
    - checkout
    - architect/tools-info
    - architect/go-cache-restore
    - run:
        name: Run envtest-backed RBAC integration tests
        command: make test-envtest
    - architect/go-cache-save

  # Chart checks: helm lint, the helm-unittest suites in helm/muster/tests/, and
  # the promtool unit tests for the PrometheusRule. Runs in a plain container
  # rather than the architect executor because the dependencies are helm plugins
  # and a promtool binary, not Go tooling -- nothing here needs the Go cache or
  # module auth. Pinned versions so a plugin release cannot turn CI red on an
  # unrelated PR.
  chart-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      HELM_VERSION: v3.16.0
      PROMETHEUS_VERSION: 3.6.0
      YQ_VERSION: v4.44.6
    steps:
      - checkout
      - run:
          name: Install helm, promtool and yq
          command: |
            set -euxo pipefail
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
            # mikefarah/yq -- cimg/base ships no yq, and the python jq wrapper
            # of the same name does not understand `yq eval`.
            sudo curl -sSLo /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            sudo chmod 0755 /usr/local/bin/yq
            helm version --short && promtool --version && yq --version
      - run:
          name: Run chart tests
          command: make helm-test

workflows:
  build:
    jobs:
    # ---- Chart checks. Independent of go-build: a chart-only PR gets the
    #      signal without waiting on the Go matrix, and a Go-only PR still
    #      proves the chart renders. Same tag filter as the other test jobs.
    - chart-test:
        filters:
          tags:
            only: /^v.*/

    # ---- envtest-backed RBAC integration test. Same filters as go-build
    #      (runs on every branch and on release tags) since it's a test job
    #      like go-build's own embedded `make test`, not a branch-only publish
    #      step.
    - test-envtest:
        context: architect
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/

    # ---- Branch builds: dev image for PR validation. split-china-push is
    #      safe on branches: registries-data marks Aliyun push_dev_image=false.
    - architect/push-to-registries:
        context: architect
        name: push-to-registries
        split-china-push: true
        platforms: "linux/amd64,linux/arm64"
        requires:
        - go-build
        filters:
          branches:
            ignore:
            - main

    # ---- Branch: push dev chart after tests + the dev image ----
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-muster-to-giantswarm-app-catalog
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: muster
        requires:
        - execute-chart-tests
        - push-to-registries
        filters:
          branches:
            ignore:
            - main

    # ---- muster-crds: the standalone CRD-only chart. Versioned in lockstep
    #      with muster off the same git tag (.abs
    #      replace-chart-version-with-git). Same shape as the generated muster
    #      chart pipeline: build, ATS tests, branch push, tag push.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: build-muster-crds-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: muster-crds
        # chart name differs from the repo (muster) -- required by the orb's
        # chart-name check to publish a second chart from this repo.
        explicit_allow_chart_name_mismatch: true
        push_to_appcatalog: false
        push_to_oci_registry: false
        persist_chart_archive: true
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main

    - architect/run-tests-with-ats:
        name: execute-muster-crds-chart-tests
        requires:
        - build-muster-crds-chart
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main

    # ---- Branch: push dev CRD chart after tests + the dev image ----
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-muster-crds-to-giantswarm-app-catalog
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: muster-crds
        explicit_allow_chart_name_mismatch: true
        requires:
        - execute-muster-crds-chart-tests
        - push-to-registries
        filters:
          branches:
            ignore:
            - main

    # ---- Tag: push CRD chart after tests + the gsoci image. Intentionally
    #      does NOT depend on sync-china-registry so the chart catalog can
    #      publish even if the in-China Aliyun mirror is slow or fails.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-muster-crds-to-giantswarm-app-catalog-release
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: muster-crds
        explicit_allow_chart_name_mismatch: true
        requires:
        - execute-muster-crds-chart-tests
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
