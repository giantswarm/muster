# DO NOT EDIT. This file is generated by `devctl gen circleci` and kept in sync
# by the giantswarm/github align-files workflow. Change the generator in devctl
# (pkg/gen/input/circleci) or the gen.ci config in giantswarm/github, not here.
# Repo-specific jobs and workflows go in .circleci/custom.yml, which the setup
# workflow in .circleci/config.yml merges into this file at pipeline runtime.
version: 2.1
orbs:
  architect: giantswarm/architect@10.3.0

workflows:
  build:
    jobs:
    - architect/go-build:
        name: go-build
        binary: muster
        context: architect
        # Run unit tests through `make test` rather than the orb's hardcoded
        # `go test ./...`, so CI and local agent runs use the same command.
        # The generic Makefile target is `go test ./...`; repos that need more
        # (-race, integration suites, govulncheck, helm-unittest, CRD-freshness)
        # override their own `make test`. See devctl makefile gen and the
        # make-target-ci-interface ADR.
        test_target: test
        # On failure, keep test-reports/ (written by `make test`) as a
        # build artifact: the console output only shows a trimmed tail of what
        # the test suite writes there, and a failure is only attributable with
        # the full report. store_artifacts has no `when` of its own, so the
        # directory is staged by a step that only runs when the job failed; a
        # green run uploads nothing. post-steps is the one hook CircleCI offers
        # on an orb job invocation, and the repo-owned custom.yml cannot carry
        # it: the setup workflow's yq `*+` merge appends a second
        # architect/go-build entry instead of amending this one.
        post-steps:
        - run:
            name: Collect test artifacts
            command: |
              mkdir -p /tmp/go-test-artifacts
              cp -r test-reports/. /tmp/go-test-artifacts/ 2>/dev/null || true
            when: on_fail
        - store_artifacts:
            path: /tmp/go-test-artifacts
            destination: test-reports
        # Cross-platform binaries attached to the GitHub Release by the
        # upload-release-assets job below (cli flavour). yamllint disables the
        # line-length rule for the 132-char matrix value.
        # yamllint disable-line rule:line-length
        architectures: "linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64"
        # The six-arch cross-compile is cold after every go.sum bump (the GOCACHE
        # restore misses), so compile the architectures concurrently on a larger
        # box instead of sequentially on 2 vCPUs. build_concurrency is opt-in in
        # the orb because it only pays off at a bigger resource_class. A repo
        # whose binary is large enough that the cold full-matrix build OOMs at
        # `auto` lowers build_concurrency (and/or raises resource_class) via
        # gen.ci.buildConcurrency / gen.ci.resourceClass.
        # build_concurrency is a string-typed orb param: "auto" is a valid bare
        # scalar, but a bare number (e.g. 2) parses as an int and the orb rejects
        # it -- so quote anything that isn't "auto".
        build_concurrency: auto
        resource_class: large
        filters:
          tags:
            only: /^v.*/

    # Attach the cross-platform go-build binaries to the GitHub Release on tag
    # builds. The release itself is created by the repo's auto-release flow.
    - architect/upload-release-assets:
        context: architect
        name: upload-release-assets
        binary: muster
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Branches: validate the image build without pushing anything (push: false
    # keeps the buildx result in the BuildKit cache). Same hadolint lint and
    # multi-arch build as the release job, so Dockerfile regressions surface
    # on the PR instead of at tag time.
    - architect/push-to-registries:
        context: architect
        name: build-image
        push: false
        # Same platform cap as the release job: go-build's six-target
        # architectures matrix writes all of them to .platforms, and buildx
        # must not attempt the darwin/windows manifests under QEMU.
        platforms: "linux/amd64,linux/arm64"
        requires:
        - go-build
        filters:
          branches:
            ignore:
            - main

    # Tag builds: push multi-arch image to gsoci + gsociprivate. Aliyun is
    # handled by the sync-china-registry job below (orb's split-china-push
    # mechanism), so the buildx push no longer crosses the Pacific.
    - architect/push-to-registries:
        context: architect
        name: push-to-registries-release
        split-china-push: true
        # Cap buildx to the two linux platforms. go-build's architectures
        # matrix above writes all six targets to .platforms; without this cap
        # the orb auto-derives --platform from that file and buildx tries to
        # build the darwin/windows manifests under QEMU and hangs.
        platforms: "linux/amd64,linux/arm64"
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # Mirror gsoci -> Aliyun via the in-China giantswarm/galaxy-runner. Runs
    # in parallel with the chart catalog push; Aliyun mirror failures do NOT
    # block the chart publish.
    - architect/sync-china-registry:
        context: architect
        name: sync-china-registry
        requires:
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # build-chart: package + lint via app-build-suite and persist the archive
    # (no push). Shared by the branch and tag paths -- branches get build + test
    # only by default.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: build-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: muster
        push_to_appcatalog: false
        push_to_oci_registry: false
        persist_chart_archive: true
        requires:
        - go-build
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main

    # Branch: run chart tests after build-chart. When branchPublish pushes a dev
    # image, the test also waits on push-to-registries -- run-tests-with-ats
    # deploys the chart, which pulls that image from gsoci, and gating on the
    # push avoids an ImagePullBackOff race.
    - architect/run-tests-with-ats:
        name: execute-chart-tests
        app-test-suite_container_tag: "1.0.2"
        # app-test-suite 1.x provisions no cluster: the job creates the kind
        # cluster and runs the pinned image against its kubeconfig.
        create_kind_cluster: true
        requires:
        - build-chart
        filters:
          branches:
            ignore:
            - main

    # Tag: push the chart after build-chart (+ the gsoci image). The chart
    # tests ran on the branch (execute-chart-tests) and the tag is cut from the
    # merge commit of a PR whose branch run tested this tree, so they are not
    # re-run here (atsOnRelease brings the tag-time run back). Make the
    # ci/circleci statuses required checks on the default branch, with
    # up-to-date branches (strict), so a PR cannot merge before that run is
    # green. Intentionally does NOT depend on sync-china-registry so the chart
    # catalog can publish even if the in-China Aliyun mirror is slow or fails.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-chart-release
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: muster
        requires:
        - build-chart
        - push-to-registries-release
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
