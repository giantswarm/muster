name: Documentation

# Every pull request that touches the documentation builds the site in strict
# mode: a broken link, a page missing from the navigation or an unknown anchor
# fails the check instead of reaching https://giantswarm.github.io/muster/.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the site
        run: uvx --with-requirements requirements-docs.txt mkdocs build --strict
