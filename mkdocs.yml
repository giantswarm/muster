site_name: muster
site_description: One MCP endpoint for every MCP server a platform team runs. Aggregation, discovery, toolsets and OAuth for AI agents.
site_url: https://giantswarm.github.io/muster/
repo_url: https://github.com/giantswarm/muster
repo_name: giantswarm/muster
edit_uri: edit/main/docs/
copyright: Copyright &copy; Giant Swarm GmbH &middot; Apache License 2.0

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# Every page is listed in the nav and every link must resolve: `mkdocs build
# --strict` (make docs-build, the docs workflows) fails on any of these.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn

nav:
  - Home: index.md
  - Getting started:
      - getting-started/README.md
      - Quick start: getting-started/quick-start.md
      - Register servers and workflows: getting-started/platform-setup.md
