{{- if .Values.muster.observability.metrics.prometheus.prometheusRule.enabled }}
# Alerts on muster's own view of its MCP backends.
#
# muster records every backend's connection state in MCPServer.status.state and
# now exports it as muster_mcpserver_state; these rules are what turns that from
# a field somebody has to run kubectl to see into something that pages. Before
# them a backend could sit Failed indefinitely with the error text right there
# in status.lastError and nothing would say so.
#
# Of the states, only "Failed" is alerted on. "Awaiting Session" is the
# normal steady state of a server served per session with the caller's
# identity (forwardToken, tokenExchange) while no session is connected,
# "Auth Required" that of a
# server a person signs in to through muster, and every such server passes
# through them after a muster restart, so alerting on either would be pure
# noise. A per-session server whose token exchange is broken for every caller
# (credentials Secret missing, invalid_client, token endpoint down, unknown
# connector) reads Failed and is covered. The transitional states
# (Connecting, Starting) are covered by the
# `for:` windows below rather than by being excluded.
#
# Gated on its own value rather than on the prometheus exporter: metrics may
# reach the Prometheus that loads this rule via OTLP instead of a scrape, in
# which case muster.observability.metrics.exporter never mentions prometheus.
#
# Every expression aggregates over $by and nothing else. $by is what the Giant
# Swarm Alertmanager groups, prints and inhibits on (cluster_id, installation,
# pipeline, provider; namespace because a cluster can run more than one
# release) plus the one dimension these alerts have, the MCPServer. The scrape
# labels the series also carry (pod, instance, container, endpoint, service,
# job, otel_scope_name) must not reach the alert: they change on every muster
# rollout, and an alert that carries them is a different alert after each one.
# The old pod's series ends and Alertmanager sends RESOLVED; the new pod's
# series starts a fresh `for` window and fires again when it runs out. Four
# rollouts in one day produced seven notifications for a backend that never
# changed state.
{{- $by := "cluster_id, installation, pipeline, provider, namespace, mcpserver_namespace, mcpserver_name" }}
{{- $byServer := "cluster_id, installation, pipeline, provider, namespace, mcpserver_name" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "muster.fullname" . }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
    {{- with .Values.muster.observability.metrics.prometheus.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: muster
      rules:
        # The window has to ride out a muster rollout: every MCPServer is
        # re-reconciled from scratch after a restart, and a backend that is
        # slow to answer its first handshake reads as Failed until it does.
        # 20m is comfortably longer than a rollout plus initial connect
        # backoff, and still two orders of magnitude below the ~2 days this
        # went unnoticed for.
        #
        # max, not sum: a rolling update runs the new pod next to the old one
        # for a while, both export the gauge, and 1 + 1 == 1 is false.
        - alert: MusterMCPServerFailed
          annotations:
            description: '{{`MCPServer {{ $labels.mcpserver_namespace }}/{{ $labels.mcpserver_name }} has been in state Failed for 20m; the MCP backend is unreachable and its tools are unavailable to agents. The reason muster recorded is in the CR status.lastError field.`}}'
            runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/muster-mcpserver-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
          expr: |-
            max by ({{ $by }}) (muster_mcpserver_state{state="Failed"}) == 1
          for: 20m
          labels:
            area: platform
            cancel_if_monitoring_agent_down: "true"
            cancel_if_outside_working_hours: "false"
            severity: notify
            team: bumblebee
            topic: muster
        # Steady-state Failed is not the only way a backend is broken: one that
        # reconnects and drops every few minutes never satisfies the 20m window
        # above, but is just as unusable. muster_mcpserver_state_transitions_total
        # counts entries into each state, so the churn is visible even when no
        # single scrape catches the server down.
        #
        # A muster restart contributes exactly one Failed transition per broken
        # server, well under the threshold, so rollouts do not trip this.
        #
        # sum, not max: the counter is per process, so across a rollout the
        # transitions the old and the new pod observed add up to what the
        # backend did.
        - alert: MusterMCPServerFlapping
          annotations:
            description: '{{`MCPServer {{ $labels.mcpserver_namespace }}/{{ $labels.mcpserver_name }} entered state Failed {{ $value | printf "%.0f" }} times in the last hour; the MCP backend is connecting and dropping repeatedly.`}}'
            runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/muster-mcpserver-failed/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
          expr: |-
            sum by ({{ $by }}) (increase(muster_mcpserver_state_transitions_total{state="Failed"}[1h])) > 5
          for: 10m
          labels:
            area: platform
            cancel_if_monitoring_agent_down: "true"
            cancel_if_outside_working_hours: "false"
            severity: notify
            team: bumblebee
            topic: muster
        # A backend that reads Connected while its calls fail: the ratio of
        # dispatches that ended in a Go error (transport failure, timeout,
        # 5xx) among all dispatches to one MCPServer.
        #
        # muster_downstream_tool_calls, not muster_tool_calls: call_tool turns
        # every backend error into an error result, so muster_tool_calls sees
        # agent traffic as outcome="error_result", mixed with auth_required
        # answers and bad arguments. Those are error_result here too and are
        # left out; only outcome="error" counts.
        #
        # Grouped by MCPServer, not by tool: one tool that times out on heavy
        # input is usually the caller's query, and per-tool series are too
        # thin for a stable ratio. The 20-call floor keeps a single failure on
        # an idle backend from paging.
        #
        # A Failed backend answers every dispatch with "server not connected",
        # an outcome="error", and MusterMCPServerFailed already covers it. The
        # unless clause keeps one broken backend from paging twice. The
        # downstream series carry no mcpserver_namespace, so the clause joins
        # on the name: two MCPServers of one name in different namespaces of
        # one muster share the suppression.
        - alert: MusterToolCallErrorRate
          annotations:
            description: '{{`{{ $value | humanizePercentage }} of the tool calls muster dispatched to MCPServer {{ $labels.mcpserver_name }} in the last 15m failed with a transport error or timeout, while the server is not Failed.`}}'
            runbook_url: '{{`https://intranet.giantswarm.io/docs/support-and-ops/runbooks/muster-tool-call-errors/?INSTALLATION={{ $labels.installation }}&CLUSTER={{ $labels.cluster_id }}`}}'
          expr: |-
            (
              sum by ({{ $byServer }}) (rate(muster_downstream_tool_calls_total{outcome="error"}[15m]))
              /
              sum by ({{ $byServer }}) (rate(muster_downstream_tool_calls_total[15m]))
            ) > 0.25
            and
            sum by ({{ $byServer }}) (increase(muster_downstream_tool_calls_total[15m])) >= 20
            unless on ({{ $byServer }})
            max by ({{ $byServer }}) (muster_mcpserver_state{state="Failed"}) == 1
          for: 15m
          labels:
            area: platform
            cancel_if_monitoring_agent_down: "true"
            cancel_if_outside_working_hours: "false"
            severity: notify
            team: bumblebee
            topic: muster
{{- end }}
