{{/*
mcpserver-editor: who may register and manage MCPServer resources.

Session-initiated MCPServer mutations — create/update/delete and CR-driven
lifecycle (start/stop/restart) — are written against the Kubernetes API with
the caller's own identity, so k8s RBAC authorizes each write. Whoever holds
the Role is a connector admin (tool approval: spec.approval, and letting an
agent skip a tool's Ask). The chart binds nobody by default: the Role always
ships, the RoleBinding only for a non-empty rbac.mcpServerEditor.subjects
(an admin group; system:authenticated lets every authenticated user
register MCP servers).
*/}}
{{- if and .Values.rbac.create .Values.rbac.mcpServerEditor.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcpserver-editor
  namespace: {{ include "muster.namespace" . }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
rules:
  - apiGroups: ["muster.giantswarm.io"]
    resources: ["mcpservers"]
    verbs: ["create", "update", "patch", "delete"]
  # A connector's client entered in the portal is written as the editor to a
  # Secret owned by the MCPServer (giantswarm/giantswarm#38849). create only:
  # get, update or delete would reach every Secret of the namespace, muster's
  # own included; mcpserver-client-secrets.yaml holds the create to such
  # client Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]

{{- with .Values.rbac.mcpServerEditor.subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcpserver-editor
  namespace: {{ include "muster.namespace" $ }}
  labels:
    {{- include "muster.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcpserver-editor
subjects:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
