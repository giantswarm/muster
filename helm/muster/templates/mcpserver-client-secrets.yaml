{{/*
mcpserver-client-secrets: a writer who may not get a Secret of muster's
namespace creates only a connector's client there
(giantswarm/giantswarm#38849).

The mcpserver-editor Role grants create on secrets, so that
core_mcpserver_create and core_mcpserver_update can write a connector's client
as the caller (clientCredentials). create alone reaches every Secret type and
name of the namespace: a kubernetes.io/service-account-token Secret annotated
for muster's ServiceAccount gets a token minted into it, and a name muster or
its chart expects can be taken before it exists. This policy admits a Secret
created by a writer who may not get it (the API server's authorizer, as
mcpserver-secret-references checks) only as an Opaque Secret named like a
generated client Secret:
<server, cut to 38 characters>-muster-client-<10 of [a-z0-9]>
A writer who may get the Secret (Helm, a GitOps controller, muster's
operators) creates what they create today.
*/}}
{{- if .Values.mcpServerClientSecrets.enabled }}
{{- $name := include "muster.mcpServerClientSecretsName" . }}
{{- $namespace := include "muster.namespace" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $namespace }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  variables:
    - name: name
      expression: "has(object.metadata.name) ? string(object.metadata.name) : ''"
    - name: writerMayGet
      expression: >-
        authorizer.group('').resource('secrets')
          .namespace(string(request.namespace)).name(variables.name).check('get').allowed()
    - name: clientSecret
      expression: >-
        (!has(object.type) || object.type == 'Opaque') &&
        variables.name.matches('^[a-z0-9]([-a-z0-9.]{0,36}[a-z0-9])?-muster-client-[a-z0-9]{10}$')
  validations:
    - expression: "variables.writerMayGet || variables.clientSecret"
      messageExpression: >-
        'a writer who may not get Secrets of this namespace creates only a connector client, an Opaque Secret named <server>-muster-client-<10 of [a-z0-9]>; refused: ' +
        (variables.name == '' ? '<no name>' : variables.name) + ' of type ' + (has(object.type) ? string(object.type) : 'Opaque')
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
