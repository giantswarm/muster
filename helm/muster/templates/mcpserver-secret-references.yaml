{{/*
mcpserver-secret-references: an MCPServer names only Secrets its writer may
get (giantswarm/giantswarm#38827).

muster reads the Secrets an MCPServer's spec names (spec.headersFrom and the
clientCredentialsSecretRef of spec.auth.authorizationServer and
spec.auth.tokenExchange) with its own ServiceAccount and sends them to
endpoints of the same spec. The policy checks each of those Secrets against
the writer's own RBAC, with the API server's authorizer: a writer who may not
get a Secret may not have muster read it either.

It holds on every create and on every update that changes the spec, so a
writer who may not get a Secret can neither name it nor point a server that
names it at another endpoint. Updates that leave the spec alone (status,
finalizers, labels) and objects being deleted are admitted. A reference
without a namespace resolves to the MCPServer's; headersFrom has none.
*/}}
{{- if .Values.mcpServerSecretReferences.enabled }}
{{- $name := printf "%s-mcpserver-secret-references" (include "muster.fullname" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["muster.giantswarm.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mcpservers"]
  matchConditions:
    - name: spec-written
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: headerRefs
      expression: >-
        has(object.spec.headersFrom) ?
        object.spec.headersFrom.filter(h, h.valueFrom.type == 'Secret')
          .map(h, {'namespace': string(request.namespace), 'name': string(h.valueFrom.name)}) : []
    - name: authRefs
      expression: >-
        !has(object.spec.auth) ? [] :
        (has(object.spec.auth.authorizationServer) && has(object.spec.auth.authorizationServer.clientCredentialsSecretRef) ?
          [object.spec.auth.authorizationServer.clientCredentialsSecretRef] : []) +
        (has(object.spec.auth.tokenExchange) && has(object.spec.auth.tokenExchange.clientCredentialsSecretRef) ?
          [object.spec.auth.tokenExchange.clientCredentialsSecretRef] : [])
    - name: refs
      expression: >-
        variables.headerRefs + variables.authRefs.map(r, {
          'namespace': has(r.__namespace__) && r.__namespace__ != '' ? string(r.__namespace__) : string(request.namespace),
          'name': string(r.name)})
  validations:
    - expression: >-
        variables.refs.all(r, authorizer.group('').resource('secrets')
          .namespace(r.namespace).name(r.name).check('get').allowed())
      messageExpression: >-
        'the writer of an MCPServer may name only Secrets they may get; it names ' +
        variables.refs.map(r, r.namespace + '/' + r.name).join(', ')
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions:
    {{- toYaml .Values.mcpServerSecretReferences.validationActions | nindent 4 }}
{{- end }}
