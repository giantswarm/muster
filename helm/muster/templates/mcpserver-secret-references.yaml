{{/*
mcpserver-secret-references: an MCPServer names only Secrets its writer may
get (giantswarm/giantswarm#38827).

muster reads the Secrets an MCPServer's spec names (spec.headersFrom and the
clientCredentialsSecretRef of spec.auth.authorizationServer and
spec.auth.tokenExchange) with its own ServiceAccount and sends them to
endpoints of the same spec. The policy checks each of those Secrets against
the writer's own RBAC, with the API server's authorizer: a writer who may not
get a Secret may not have muster read it either.

It holds on every create and on every update that changes the spec, so a
writer who may not get a Secret can neither name it nor point a server that
names it at another endpoint. Updates that leave the spec alone (status,
finalizers, labels) are admitted. A spec change to an MCPServer being deleted
is checked too: a finalizer can hold it there indefinitely, and muster serves
it until it is gone. A reference without a namespace resolves to the
MCPServer's; headersFrom has none.

One reference is exempt: an authorizationServer clientCredentialsSecretRef
in the MCPServer's own namespace, when that is muster's, whose name is the one
core_mcpserver_create and update generate for the server's client:
<name, cut to 44 characters>-oauth-client-<5 of [a-z0-9]>
(giantswarm/giantswarm#38849). Editors may create Secrets but not get them;
muster reads such a Secret only when it has an ownerReference to the
MCPServer's UID.

muster reads no Secret for an MCPServer while this binding is missing, does
not deny, or narrows the MCPServers it applies to, or while the policy is
missing or does not fail closed.
*/}}
{{- if .Values.mcpServerSecretReferences.enabled }}
{{- $name := include "muster.mcpServerSecretReferencesName" . }}
{{- $namespace := include "muster.namespace" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["muster.giantswarm.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["mcpservers"]
  matchConditions:
    - name: spec-written
      expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
  variables:
    - name: headerRefs
      expression: >-
        has(object.spec.headersFrom) ?
        object.spec.headersFrom.filter(h, h.valueFrom.type == 'Secret')
          .map(h, {'namespace': string(request.namespace), 'name': string(h.valueFrom.name)}) : []
    - name: generatedClientPrefix
      expression: >-
        (size(object.metadata.name) > 44 ? object.metadata.name.substring(0, 44) : object.metadata.name) + '-oauth-client-'
    - name: generatedClientRef
      expression: >-
        string(request.namespace) == '{{ $namespace }}' &&
        has(object.spec.auth) && has(object.spec.auth.authorizationServer) &&
        has(object.spec.auth.authorizationServer.clientCredentialsSecretRef) &&
        (!has(object.spec.auth.authorizationServer.clientCredentialsSecretRef.__namespace__) ||
          object.spec.auth.authorizationServer.clientCredentialsSecretRef.__namespace__ == '' ||
          object.spec.auth.authorizationServer.clientCredentialsSecretRef.__namespace__ == '{{ $namespace }}') &&
        object.spec.auth.authorizationServer.clientCredentialsSecretRef.name.startsWith(variables.generatedClientPrefix) &&
        size(object.spec.auth.authorizationServer.clientCredentialsSecretRef.name) == size(variables.generatedClientPrefix) + 5 &&
        object.spec.auth.authorizationServer.clientCredentialsSecretRef.name.substring(size(variables.generatedClientPrefix)).matches('^[a-z0-9]{5}$')
    - name: authRefs
      expression: >-
        !has(object.spec.auth) ? [] :
        (has(object.spec.auth.authorizationServer) && has(object.spec.auth.authorizationServer.clientCredentialsSecretRef) &&
          !variables.generatedClientRef ?
          [object.spec.auth.authorizationServer.clientCredentialsSecretRef] : []) +
        (has(object.spec.auth.tokenExchange) && has(object.spec.auth.tokenExchange.clientCredentialsSecretRef) ?
          [object.spec.auth.tokenExchange.clientCredentialsSecretRef] : [])
    - name: refs
      expression: >-
        variables.headerRefs + variables.authRefs.map(r, {
          'namespace': has(r.__namespace__) && r.__namespace__ != '' ? string(r.__namespace__) : string(request.namespace),
          'name': string(r.name)})
  validations:
    - expression: >-
        variables.refs.all(r, authorizer.group('').resource('secrets')
          .namespace(r.namespace).name(r.name).check('get').allowed())
      messageExpression: >-
        'the writer of an MCPServer may name only Secrets they may get; it names ' +
        variables.refs.map(r, r.namespace + '/' + r.name).join(', ')
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
