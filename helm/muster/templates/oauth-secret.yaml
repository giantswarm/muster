{{- if and (or .Values.muster.oauth.server.enabled .Values.muster.oauth.server.encryptionKey) (not .Values.muster.oauth.server.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muster.fullname" . }}-oauth
  namespace: {{ .Release.Namespace }}
  {{- if .Values.muster.oauth.server.encryptionKey }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "muster.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "muster.oauthSecretData" . | nindent 2 }}
{{- end }}
