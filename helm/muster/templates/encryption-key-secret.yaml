{{- if .Values.muster.oauth.server.encryptionKey }}
{{- $key := include "muster.encryptionKey" . | fromJson }}
{{- if $key.managed }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $key.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "muster.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key.key }}: {{ $key.data | quote }}
{{- end }}
{{- end }}
