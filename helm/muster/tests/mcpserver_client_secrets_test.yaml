suite: mcpserver-client-secrets admission policy tests
templates:
  - templates/mcpserver-client-secrets.yaml

tests:
  - it: ships the policy and its binding, denying, on Secret creates in muster's namespace
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ValidatingAdmissionPolicy
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-muster-mcpserver-client-secrets
        documentIndex: 0
      - equal:
          path: spec.failurePolicy
          value: Fail
        documentIndex: 0
      - equal:
          path: spec.matchConstraints.resourceRules
          value:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE"]
              resources: ["secrets"]
        documentIndex: 0
      - equal:
          path: spec.matchConstraints.namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: NAMESPACE
        documentIndex: 0
      - isKind:
          of: ValidatingAdmissionPolicyBinding
        documentIndex: 1
      - equal:
          path: spec.policyName
          value: RELEASE-NAME-muster-mcpserver-client-secrets
        documentIndex: 1
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1

  - it: admits any Secret to a writer who may get it, and only an Opaque client Secret to the others
    asserts:
      - equal:
          path: spec.variables[1].name
          value: writerMayGet
        documentIndex: 0
      - matchRegex:
          path: spec.variables[1].expression
          pattern: "authorizer\\.group\\(''\\)\\.resource\\('secrets'\\)\\s*\\.namespace\\(string\\(request\\.namespace\\)\\)\\.name\\(variables\\.name\\)\\.check\\('get'\\)\\.allowed\\(\\)"
        documentIndex: 0
      - equal:
          path: spec.variables[2].name
          value: clientSecret
        documentIndex: 0
      - matchRegex:
          path: spec.variables[2].expression
          pattern: "object\\.type == 'Opaque'"
        documentIndex: 0
      - matchRegex:
          path: spec.variables[2].expression
          pattern: "\\{0,36\\}\\[a-z0-9\\]\\)\\?-muster-client-\\[a-z0-9\\]\\{10\\}\\$'\\)$"
        documentIndex: 0
      - equal:
          path: spec.validations[0].expression
          value: "variables.writerMayGet || variables.clientSecret"
        documentIndex: 0
      - equal:
          path: spec.validations[0].reason
          value: Forbidden
        documentIndex: 0

  - it: holds muster's namespace
    set:
      muster.namespace: mcp-servers
    asserts:
      - equal:
          path: spec.matchConstraints.namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: mcp-servers
        documentIndex: 0

  - it: renders nothing when disabled
    set:
      mcpServerClientSecrets.enabled: false
    asserts:
      - hasDocuments:
          count: 0
