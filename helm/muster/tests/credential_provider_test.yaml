# Credential provider tests for the muster Helm chart
#
# muster.credentialProvider serves Substrate's FetchSecret to the egress
# gateway on its own port with Substrate pod certificates. Off by default; on,
# it needs the gateway identity, a releasable provider and the OAuth server.
suite: credential provider
templates:
  - templates/configmap.yaml
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/networkpolicy.yaml
release:
  name: muster
  namespace: agent-platform
set:
  muster.oauth.server.enabled: true
  muster.oauth.server.existingSecret: muster-oauth
  muster.oauth.server.baseUrl: https://muster.example.test
tests:
  - it: renders nothing while disabled
    template: templates/service.yaml
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1

  - it: configures the provider
    template: templates/configmap.yaml
    set: &enabled
      muster.credentialProvider.enabled: true
      muster.credentialProvider.gatewayIdentity: spiffe://cluster.local/ns/substrate/sa/substrate-atenet-egress
      muster.credentialProvider.releasable.github: https://github.com/apps/giantswarm-workspaces
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'credentialProvider:\n\s+enabled: true\n\s+listenAddress: ":50051"\n\s+serverCredBundle: /run/servicedns.podcert.ate.dev/credential-bundle.pem\n\s+clientCAFile: /run/podidentity.podcert.ate.dev/trust-bundle.pem\n\s+gatewayIdentity: "spiffe://cluster.local/ns/substrate/sa/substrate-atenet-egress"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'releasable:\n\s+github: https://github.com/apps/giantswarm-workspaces'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'gitUsers:'

  - it: renders the git user per provider instance
    template: templates/configmap.yaml
    set:
      <<: *enabled
      muster.credentialProvider.releasable.gitlab: https://gitlab.example.com
      muster.credentialProvider.gitUsers.gitlab: oauth2
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'gitUsers:\n\s+gitlab: oauth2'

  - it: mounts the pod certificates and exposes the port
    template: templates/deployment.yaml
    set: *enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: credprovider, containerPort: 50051, protocol: TCP}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: servicedns, mountPath: /run/servicedns.podcert.ate.dev, readOnly: true}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: podidentity, mountPath: /run/podidentity.podcert.ate.dev, readOnly: true}
      - equal:
          path: spec.template.spec.volumes[?(@.name == "servicedns")].projected.sources[0].podCertificate.signerName
          value: servicedns.podcert.ate.dev/identity

  - it: serves the port on the Service
    template: templates/service.yaml
    set: *enabled
    asserts:
      - contains:
          path: spec.ports
          content: {port: 50051, targetPort: credprovider, protocol: TCP, name: credprovider}

  - it: admits the port through the network policy
    template: templates/networkpolicy.yaml
    set:
      <<: *enabled
      networkPolicy.enabled: true
      networkPolicy.flavor: kubernetes
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content: {port: 50051, protocol: TCP}

  - it: refuses an incomplete configuration
    template: templates/deployment.yaml
    set:
      muster.credentialProvider.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: muster.credentialProvider.gatewayIdentity is required

  - it: refuses the provider without the OAuth server
    template: templates/deployment.yaml
    set:
      <<: *enabled
      muster.oauth.server.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: muster.credentialProvider needs muster.oauth.server.enabled

  - it: configures the actor bearer with the in-cluster issuer's defaults
    template: templates/configmap.yaml
    set:
      <<: *enabled
      muster.credentialProvider.actorBearer.enabled: true
      muster.credentialProvider.actorBearer.issuer: https://idp.substrate.svc
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'actorBearer:\n\s+enabled: true\n\s+issuer: "https://idp.substrate.svc"\n\s+audience: "https://muster.example.test"\n\s+caFile: /run/servicedns.podcert.ate.dev/trust-bundle.pem\n\s+allowPrivateIPJWKSHosts:\n\s+- idp.substrate.svc'

  - it: runs the actor bearer without a releasable provider
    template: templates/configmap.yaml
    set:
      muster.credentialProvider.enabled: true
      muster.credentialProvider.gatewayIdentity: spiffe://cluster.local/ns/substrate/sa/substrate-atenet-egress
      muster.credentialProvider.actorBearer.enabled: true
      muster.credentialProvider.actorBearer.issuer: https://idp.substrate.svc
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: releasable

  - it: refuses the actor bearer without an issuer
    template: templates/deployment.yaml
    set:
      <<: *enabled
      muster.credentialProvider.actorBearer.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: muster.credentialProvider.actorBearer.issuer is required
