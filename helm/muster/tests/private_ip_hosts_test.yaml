suite: private-address host lists
templates:
  - templates/configmap.yaml
set:
  muster.oauth.mcpClient.enabled: true
  muster.oauth.mcpClient.publicUrl: https://muster.example.test
  muster.oauth.server.enabled: true
  muster.oauth.server.baseUrl: https://muster.example.test
  muster.oauth.server.existingSecret: muster-oauth
  muster.oauth.server.dex.issuerUrl: https://dex.example.test
  muster.oauth.server.dex.clientId: muster
tests:
  - it: renders no host list and no token exchange block by default
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "allowPrivateIPRedirectURIHosts|tokenExchange:"
  - it: renders allowPrivateIPRedirectURIHosts
    set:
      muster.oauth.server.allowPrivateIPRedirectURIHosts:
        - agentgateway.internal.example
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "allowPrivateIPRedirectURIHosts:\\n\\s+- agentgateway\\.internal\\.example"
  - it: renders allowPrivateIPTokenEndpointHosts under the client's tokenExchange
    set:
      muster.oauth.mcpClient.tokenExchange.allowPrivateIPTokenEndpointHosts:
        - dex.internal.example
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "tokenExchange:\\n\\s+allowPrivateIPTokenEndpointHosts:\\n\\s+- dex\\.internal\\.example"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "allowPrivateIP: true"
  - it: still renders the deprecated tokenExchange.allowPrivateIP beside the list
    set:
      muster.oauth.mcpClient.tokenExchange.allowPrivateIP: true
      muster.oauth.mcpClient.tokenExchange.allowPrivateIPTokenEndpointHosts:
        - dex.internal.example
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "tokenExchange:\\n\\s+allowPrivateIP: true\\n\\s+allowPrivateIPTokenEndpointHosts:\\n\\s+- dex\\.internal\\.example"
  - it: pins no client metadata by default
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "preRegisteredClientMetadata|restrictClientMetadata|clientMetadataHosts"
  - it: pins the installation's documents and the public clients when asked
    set:
      muster.oauth.server.preRegisterPublicClients: true
      muster.oauth.server.preRegisteredClientMetadata:
        - client_id: https://agentgateway.internal.example/auth/slack/client.json
          redirect_uris:
            - https://agentgateway.internal.example/auth/slack/callback
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "preRegisteredClientMetadata:\\n(.*\\n)*\\s+- client_id: https://claude\\.ai/oauth/mcp-oauth-client-metadata"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "client_id: https://claude\\.ai/oauth/claude-code-client-metadata"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "client_id: https://insiders\\.vscode\\.dev/oauth/client-metadata\\.json"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "client_id: https://agentgateway\\.internal\\.example/auth/slack/client\\.json"
  - it: pins only the installation's documents while preRegisterPublicClients is off
    set:
      muster.oauth.server.preRegisteredClientMetadata:
        - client_id: https://agentgateway.internal.example/auth/slack/client.json
          redirect_uris:
            - https://agentgateway.internal.example/auth/slack/callback
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "client_id: https://agentgateway\\.internal\\.example/auth/slack/client\\.json"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "claude\\.ai/oauth"
  - it: refuses restrict mode with no pin and no host
    set:
      muster.oauth.server.restrictClientMetadata: true
    asserts:
      - failedTemplate:
          errorPattern: "restrictClientMetadata needs a pinned document"
  - it: accepts restrict mode with only the public clients pinned
    set:
      muster.oauth.server.restrictClientMetadata: true
      muster.oauth.server.preRegisterPublicClients: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "restrictClientMetadata: true"
  - it: refuses clientMetadataHosts without restrict mode
    set:
      muster.oauth.server.clientMetadataHosts:
        - clients.example
    asserts:
      - failedTemplate:
          errorPattern: "clientMetadataHosts needs restrictClientMetadata: true"
  - it: refuses a public client pinned again in preRegisteredClientMetadata
    set:
      muster.oauth.server.preRegisterPublicClients: true
      muster.oauth.server.preRegisteredClientMetadata:
        - client_id: https://claude.ai/oauth/mcp-oauth-client-metadata
          redirect_uris:
            - https://claude.ai/api/mcp/auth_callback
    asserts:
      - failedTemplate:
          errorPattern: "pins client_id https://claude.ai/oauth/mcp-oauth-client-metadata twice"
  - it: renders restrict mode and its hosts
    set:
      muster.oauth.server.restrictClientMetadata: true
      muster.oauth.server.clientMetadataHosts:
        - clients.example
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "restrictClientMetadata: true\\n\\s+clientMetadataHosts:\\n\\s+- clients\\.example"
