suite: muster-approval-decider RBAC template tests
templates:
  - templates/approval-decider-rbac.yaml

tests:
  - it: ships the muster-approval-decider Role with decide on toolapprovals only, bound to nobody
    release:
      namespace: muster-system
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: muster-approval-decider
      - equal:
          path: metadata.namespace
          value: muster-system
      - equal:
          path: rules
          value:
            - apiGroups: ["muster.giantswarm.io"]
              resources: ["toolapprovals"]
              verbs: ["decide"]

  - it: binds the Role to configured subjects in muster.namespace
    release:
      namespace: rel
    set:
      muster.namespace: mcp-servers
      rbac.approvalDecider.subjects:
        - kind: ServiceAccount
          name: backstage
          namespace: agent-platform
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: mcp-servers
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: muster-approval-decider
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: backstage
        documentIndex: 1

  - it: creates nothing when the Role is managed out of band or rbac.create is false
    set:
      rbac.approvalDecider.create: false
    asserts:
      - hasDocuments:
          count: 0
