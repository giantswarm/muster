# Credential checksum tests for the muster Helm chart
#
# muster reads its OAuth credentials (the Dex or Google client secret, the
# registration token, the token encryption key) and the Valkey password from
# Secrets projected into the pod at start and never again. The pod template's
# annotations restart it when they change: checksum/oauth-secret is the
# SHA-256 of the chart-rendered Secret's data lines ("key: \"base64\"", one per
# line, no trailing newline) or muster.oauth.server.existingSecretChecksum
# verbatim for a Secret the chart does not render; checksum/valkey-secret is
# muster.oauth.server.storage.valkey.existingSecretChecksum verbatim for a
# Valkey password in a Secret of its own. The pinned hash is the SHA-256 of
#   dex-client-secret: "ZHVtbXk="\nregistration-token: "cm90YXRlLW1l"
suite: credential checksums
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
release:
  name: muster
tests:
  - it: carries no credential checksum while the OAuth server is off
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: hashes the rendered Secret's data
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: true
      muster.oauth.server.baseUrl: https://muster.example.test
      muster.oauth.server.dex.issuerUrl: https://dex.example.test
      muster.oauth.server.dex.clientId: muster
      muster.oauth.server.dex.clientSecret: dummy
      muster.oauth.server.registrationToken: rotate-me
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: 03fa57abd266450c5f4380661113dc2e713096658ea11caa93524461c13ab92a
      - notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]

  - it: changes the hash when a credential is rotated
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: true
      muster.oauth.server.baseUrl: https://muster.example.test
      muster.oauth.server.dex.issuerUrl: https://dex.example.test
      muster.oauth.server.dex.clientId: muster
      muster.oauth.server.dex.clientSecret: rotated
      muster.oauth.server.registrationToken: rotate-me
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          pattern: ^[0-9a-f]{64}$
      - notEqual:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: 03fa57abd266450c5f4380661113dc2e713096658ea11caa93524461c13ab92a

  - it: covers an inline Valkey password through the rendered Secret
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: true
      muster.oauth.server.baseUrl: https://muster.example.test
      muster.oauth.server.dex.issuerUrl: https://dex.example.test
      muster.oauth.server.dex.clientId: muster
      muster.oauth.server.dex.clientSecret: dummy
      muster.oauth.server.registrationToken: rotate-me
      muster.oauth.server.storage.type: valkey
      muster.oauth.server.storage.valkey.url: valkey.example.test:6379
      muster.oauth.server.storage.valkey.password: valkey-pass
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          pattern: ^[0-9a-f]{64}$
      - notEqual:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: 03fa57abd266450c5f4380661113dc2e713096658ea11caa93524461c13ab92a
      - notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]

  - it: renders the existing Secret's mark verbatim
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: true
      muster.oauth.server.baseUrl: https://muster.example.test
      muster.oauth.server.dex.issuerUrl: https://dex.example.test
      muster.oauth.server.dex.clientId: muster
      muster.oauth.server.existingSecret: muster-oauth-credentials
      muster.oauth.server.existingSecretChecksum: rotation-7
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: rotation-7
      - notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]

  - it: carries no mark for an existing Secret without one
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: true
      muster.oauth.server.baseUrl: https://muster.example.test
      muster.oauth.server.dex.issuerUrl: https://dex.example.test
      muster.oauth.server.dex.clientId: muster
      muster.oauth.server.existingSecret: muster-oauth-credentials
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]

  - it: marks a Valkey Secret of its own separately
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: true
      muster.oauth.server.baseUrl: https://muster.example.test
      muster.oauth.server.dex.issuerUrl: https://dex.example.test
      muster.oauth.server.dex.clientId: muster
      muster.oauth.server.existingSecret: muster-oauth-credentials
      muster.oauth.server.existingSecretChecksum: rotation-7
      muster.oauth.server.storage.type: valkey
      muster.oauth.server.storage.valkey.url: valkey.example.test:6379
      muster.oauth.server.storage.valkey.existingSecret: muster-valkey-credentials
      muster.oauth.server.storage.valkey.existingSecretChecksum: rotation-8
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: rotation-7
      - equal:
          path: spec.template.metadata.annotations["checksum/valkey-secret"]
          value: rotation-8

  - it: keeps podAnnotations beside the checksums
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: true
      muster.oauth.server.baseUrl: https://muster.example.test
      muster.oauth.server.dex.issuerUrl: https://dex.example.test
      muster.oauth.server.dex.clientId: muster
      muster.oauth.server.dex.clientSecret: dummy
      muster.oauth.server.registrationToken: rotate-me
      podAnnotations:
        example.com/note: kept
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/note"]
          value: kept
      - exists:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]
