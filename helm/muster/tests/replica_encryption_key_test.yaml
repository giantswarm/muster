suite: requestState key
release:
  name: muster
set:
  muster.oauth.server.enabled: true
  muster.oauth.server.baseUrl: "https://muster.example.com"
  muster.oauth.server.dex.issuerUrl: "https://dex.example.com"
  muster.oauth.server.dex.clientId: "muster"
  muster.oauth.server.dex.clientSecret: "s"
  muster.oauth.server.registrationToken: "r"
tests:
  - it: rejects a key reference without a selected key
    template: templates/deployment.yaml
    set:
      muster.requestState.secretKeyRef.name: state-key
      muster.oauth.server.encryptionKey: true
      muster.oauth.server.existingSecret: oauth-key
    asserts:
      - failedTemplate:
          errorMessage: "muster.requestState.secretKeyRef requires name and key"

  - it: rejects a key reference without a Secret name
    template: templates/deployment.yaml
    set:
      muster.requestState.secretKeyRef.key: root-key
    asserts:
      - failedTemplate:
          errorMessage: "muster.requestState.secretKeyRef requires name and key"

  - it: seals retry state without enabling OAuth or token encryption
    template: templates/configmap.yaml
    set:
      replicaCount: 2
      muster.oauth.server.enabled: false
      muster.requestState.secretKeyRef:
        name: request-state-root
        key: shared-root
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'requestState:\s+keyFile: /etc/muster/request-state/key'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'encryptionKeyFile:'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'protectedSecrets:\s+- request-state-root'

  - it: mounts only the selected root key
    template: templates/deployment.yaml
    set:
      replicaCount: 2
      muster.oauth.server.enabled: false
      muster.requestState.secretKeyRef:
        name: request-state-root
        key: shared-root
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: request-state-key
            mountPath: /etc/muster/request-state
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: request-state-key
            secret:
              secretName: request-state-root
              defaultMode: 288
              items:
                - key: shared-root
                  path: key

  - it: supports autoscaling with a separate root key
    template: templates/configmap.yaml
    set:
      autoscaling.enabled: true
      muster.requestState.secretKeyRef:
        name: request-state-root
        key: shared-root
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'keyFile: /etc/muster/request-state/key'

  - it: renders one replica without the encryption key
    template: templates/configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "encryptionKeyFile"

  - it: refuses more than one replica without the encryption key
    template: templates/deployment.yaml
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "multiple replicas require muster.requestState.secretKeyRef or muster.oauth.server.encryptionKey: retries must share a requestState sealing key"

  - it: refuses autoscaling without the encryption key
    template: templates/deployment.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "multiple replicas require muster.requestState.secretKeyRef or muster.oauth.server.encryptionKey: retries must share a requestState sealing key"

  - it: renders more than one replica with the encryption key
    template: templates/configmap.yaml
    set:
      replicaCount: 2
      muster.oauth.server.existingSecret: muster-oauth
      muster.oauth.server.encryptionKey: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'encryptionKeyFile: "/etc/muster/secrets/oauth-encryption-key"'

  - it: refuses multiple replicas without OAuth and without a shared key
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: false
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "multiple replicas require muster.requestState.secretKeyRef or muster.oauth.server.encryptionKey: retries must share a requestState sealing key"

  - it: renders the shared key path without enabling OAuth
    template: templates/configmap.yaml
    set:
      muster.oauth.server.enabled: false
      muster.oauth.server.encryptionKey: true
      muster.oauth.server.existingSecret: shared-key
      replicaCount: 2
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'enabled: false\s+encryptionKeyFile: "/etc/muster/secrets/oauth-encryption-key"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'protectedSecrets:\s+- shared-key'

  - it: mounts the shared key without enabling OAuth
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: false
      muster.oauth.server.encryptionKey: true
      muster.oauth.server.existingSecret: shared-key
      muster.oauth.server.storage.type: valkey
      replicaCount: 2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: oauth-secrets
            mountPath: /etc/muster/secrets
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: oauth-secrets
            projected:
              defaultMode: 288
              sources:
                - secret:
                    name: shared-key

  - it: creates only the encryption key without OAuth credentials
    template: templates/oauth-secret.yaml
    set:
      muster.oauth.server.enabled: false
      muster.oauth.server.encryptionKey: true
      muster.oauth.server.encryptionKeyValue: "test-key"
      muster.oauth.server.dex.clientSecret: ""
      muster.oauth.server.registrationToken: ""
      muster.oauth.server.storage.type: valkey
      muster.oauth.server.storage.valkey.password: unused-without-oauth
    asserts:
      - equal:
          path: data
          value:
            oauth-encryption-key: dGVzdC1rZXk=

  - it: allows autoscaling capped at one replica without a shared key
    template: templates/configmap.yaml
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 1
      autoscaling.maxReplicas: 1
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "encryptionKeyFile"
