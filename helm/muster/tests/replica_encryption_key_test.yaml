suite: requestState key
release:
  name: muster
set:
  muster.oauth.server.enabled: true
  muster.oauth.server.baseUrl: "https://muster.example.com"
  muster.oauth.server.dex.issuerUrl: "https://dex.example.com"
  muster.oauth.server.dex.clientId: "muster"
  muster.oauth.server.dex.clientSecret: "s"
  muster.oauth.server.registrationToken: "r"
tests:
  - it: renders one replica without the encryption key
    template: templates/configmap.yaml
    set:
      muster.oauth.server.encryptionKey: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "encryptionKeyFile"

  - it: refuses more than one replica without the encryption key
    template: templates/deployment.yaml
    set:
      replicaCount: 2
      muster.oauth.server.encryptionKey: false
    asserts:
      - failedTemplate:
          errorMessage: "muster.oauth.server.encryptionKey is required with more than one replica: muster derives the key that seals requestState from it, and without a shared key a client's retry that reaches another replica is refused"

  - it: refuses autoscaling without the encryption key
    template: templates/deployment.yaml
    set:
      autoscaling.enabled: true
      muster.oauth.server.encryptionKey: false
    asserts:
      - failedTemplate:
          errorMessage: "muster.oauth.server.encryptionKey is required with more than one replica: muster derives the key that seals requestState from it, and without a shared key a client's retry that reaches another replica is refused"

  - it: renders more than one replica with the encryption key
    template: templates/configmap.yaml
    set:
      replicaCount: 2
      muster.oauth.server.existingSecret: muster-oauth
      muster.oauth.server.encryptionKey: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'encryptionKeyFile: "/etc/muster/encryption/oauth-encryption-key"'

  - it: refuses multiple replicas without OAuth and without a shared key
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: false
      replicaCount: 2
      muster.oauth.server.encryptionKey: false
    asserts:
      - failedTemplate:
          errorMessage: "muster.oauth.server.encryptionKey is required with more than one replica: muster derives the key that seals requestState from it, and without a shared key a client's retry that reaches another replica is refused"

  - it: renders the shared key path without enabling OAuth
    template: templates/configmap.yaml
    set:
      muster.oauth.server.enabled: false
      muster.oauth.server.encryptionKey: true
      muster.oauth.server.encryptionKeySecret.name: shared-key
      replicaCount: 2
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'enabled: false\s+encryptionKeyFile: "/etc/muster/encryption/oauth-encryption-key"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'protectedSecrets:\s+- shared-key'

  - it: mounts the shared key without enabling OAuth
    template: templates/deployment.yaml
    set:
      muster.oauth.server.enabled: false
      muster.oauth.server.encryptionKey: true
      muster.oauth.server.encryptionKeySecret.name: shared-key
      muster.oauth.server.storage.type: valkey
      replicaCount: 2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: encryption-key
            mountPath: /etc/muster/encryption
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: encryption-key
            secret:
              secretName: shared-key
              defaultMode: 288
              items:
                - key: oauth-encryption-key
                  path: oauth-encryption-key

  - it: creates only the encryption key without OAuth credentials
    template: templates/encryption-key-secret.yaml
    set:
      muster.oauth.server.enabled: false
      muster.oauth.server.encryptionKey: true
      muster.oauth.server.encryptionKeyValue: "test-key"
      muster.oauth.server.dex.clientSecret: ""
      muster.oauth.server.registrationToken: ""
      muster.oauth.server.storage.type: valkey
      muster.oauth.server.storage.valkey.password: unused-without-oauth
    asserts:
      - equal:
          path: data
          value:
            oauth-encryption-key: dGVzdC1rZXk=

  - it: allows autoscaling capped at one replica without a shared key
    template: templates/configmap.yaml
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 1
      autoscaling.maxReplicas: 1
      muster.oauth.server.encryptionKey: false
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "encryptionKeyFile"
