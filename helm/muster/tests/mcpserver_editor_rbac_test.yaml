suite: mcpserver-editor RBAC template tests
templates:
  - templates/mcpserver-editor-rbac.yaml

tests:
  - it: ships the mcpserver-editor Role and default RoleBinding
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.name
          value: mcpserver-editor
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: ["muster.giantswarm.io"]
              resources: ["mcpservers"]
              verbs: ["create", "update", "patch", "delete"]
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: mcpserver-editor
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: mcpserver-editor
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: system:authenticated
        documentIndex: 1

  - it: places Role and RoleBinding in the MCPServer discovery namespace
    set:
      muster.namespace: mcp-servers
    asserts:
      - equal:
          path: metadata.namespace
          value: mcp-servers
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: mcp-servers
        documentIndex: 1

  - it: narrows the binding to custom subjects
    set:
      rbac.mcpServerEditor.subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: platform-admins
    asserts:
      - equal:
          path: subjects
          value:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: platform-admins
        documentIndex: 1

  - it: creates nothing when rbac.mcpServerEditor.create is false
    set:
      rbac.mcpServerEditor.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: creates nothing when rbac.create is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
