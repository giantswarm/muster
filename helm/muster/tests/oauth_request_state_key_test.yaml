suite: requestState key
release:
  name: muster
set:
  muster.oauth.server.enabled: true
  muster.oauth.server.baseUrl: "https://muster.example.com"
  muster.oauth.server.dex.issuerUrl: "https://dex.example.com"
  muster.oauth.server.dex.clientId: "muster"
  muster.oauth.server.dex.clientSecret: "s"
  muster.oauth.server.registrationToken: "r"
tests:
  - it: leaves the key out of the config by default
    template: templates/configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "requestState"

  - it: points the config at the mounted key and previous key
    template: templates/configmap.yaml
    set:
      muster.oauth.server.requestStateKey: true
      muster.oauth.server.requestStateKeyValue: "current"
      muster.oauth.server.requestStatePreviousKey: true
      muster.oauth.server.requestStatePreviousKeyValue: "previous"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'requestStateKeyFile: "/etc/muster/secrets/oauth-request-state-key"\n\s+requestStatePreviousKeyFile: "/etc/muster/secrets/oauth-request-state-previous-key"'

  - it: needs requestStateKey for the previous key
    template: templates/configmap.yaml
    set:
      muster.oauth.server.requestStatePreviousKey: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "requestStatePreviousKeyFile"

  - it: puts both keys in the chart's Secret
    template: templates/oauth-secret.yaml
    set:
      muster.oauth.server.requestStateKey: true
      muster.oauth.server.requestStateKeyValue: "current"
      muster.oauth.server.requestStatePreviousKey: true
      muster.oauth.server.requestStatePreviousKeyValue: "previous"
    asserts:
      - equal:
          path: data.oauth-request-state-key
          value: "Y3VycmVudA=="
      - equal:
          path: data.oauth-request-state-previous-key
          value: "cHJldmlvdXM="

  - it: refuses requestStateKey without a value and without existingSecret
    template: templates/oauth-secret.yaml
    set:
      muster.oauth.server.requestStateKey: true
    asserts:
      - failedTemplate:
          errorMessage: "muster.oauth.server.requestStateKeyValue is required when requestStateKey is true and existingSecret is not set"

  - it: refuses requestStatePreviousKey without a value and without existingSecret
    template: templates/oauth-secret.yaml
    set:
      muster.oauth.server.requestStateKey: true
      muster.oauth.server.requestStateKeyValue: "current"
      muster.oauth.server.requestStatePreviousKey: true
    asserts:
      - failedTemplate:
          errorMessage: "muster.oauth.server.requestStatePreviousKeyValue is required when requestStatePreviousKey is true and existingSecret is not set"

  - it: takes the keys from an existing Secret
    template: templates/configmap.yaml
    set:
      muster.oauth.server.existingSecret: muster-oauth
      muster.oauth.server.requestStateKey: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'requestStateKeyFile: "/etc/muster/secrets/oauth-request-state-key"'

  - it: refuses more than one replica without a shared key
    template: templates/deployment.yaml
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "muster.oauth.server.requestStateKey is required with more than one replica: without a shared key, a client's retry that reaches another replica is refused"

  - it: refuses autoscaling without a shared key
    template: templates/deployment.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "muster.oauth.server.requestStateKey is required with more than one replica: without a shared key, a client's retry that reaches another replica is refused"

  - it: renders more than one replica with a shared key
    template: templates/configmap.yaml
    set:
      replicaCount: 2
      muster.oauth.server.existingSecret: muster-oauth
      muster.oauth.server.requestStateKey: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'requestStateKeyFile: "/etc/muster/secrets/oauth-request-state-key"'
