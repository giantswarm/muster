suite: mcpserver-secret-references admission policy tests
templates:
  - templates/mcpserver-secret-references.yaml

tests:
  - it: ships the policy and its binding, denying
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ValidatingAdmissionPolicy
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-muster-mcpserver-secret-references
        documentIndex: 0
      - equal:
          path: spec.failurePolicy
          value: Fail
        documentIndex: 0
      - equal:
          path: spec.matchConstraints.resourceRules
          value:
            - apiGroups: ["muster.giantswarm.io"]
              apiVersions: ["*"]
              operations: ["CREATE", "UPDATE"]
              resources: ["mcpservers"]
        documentIndex: 0
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "authorizer\\.group\\(''\\)\\.resource\\('secrets'\\)\\s*\\.namespace\\(r\\.namespace\\)\\.name\\(r\\.name\\)\\.check\\('get'\\)\\.allowed\\(\\)"
        documentIndex: 0
      - isKind:
          of: ValidatingAdmissionPolicyBinding
        documentIndex: 1
      - equal:
          path: spec.policyName
          value: RELEASE-NAME-muster-mcpserver-secret-references
        documentIndex: 1
      - equal:
          path: spec.validationActions
          value: [Deny]
        documentIndex: 1

  - it: checks every create and only the updates that change the spec
    asserts:
      - equal:
          path: spec.matchConditions
          value:
            - name: spec-written
              expression: "request.operation == 'CREATE' || object.spec != oldObject.spec"
        documentIndex: 0

  - it: exempts the generated client Secret of a server in muster's namespace, and only it
    asserts:
      - equal:
          path: spec.variables[0].name
          value: headerRefs
        documentIndex: 0
      - equal:
          path: spec.variables[1].name
          value: generatedClientPrefix
        documentIndex: 0
      - equal:
          path: spec.variables[1].expression
          value: "(size(object.metadata.name) > 44 ? object.metadata.name.substring(0, 44) : object.metadata.name) + '-oauth-client-'"
        documentIndex: 0
      - equal:
          path: spec.variables[2].name
          value: generatedClientRef
        documentIndex: 0
      - matchRegex:
          path: spec.variables[2].expression
          pattern: "^string\\(request\\.namespace\\) == 'NAMESPACE' &&"
        documentIndex: 0
      - matchRegex:
          path: spec.variables[2].expression
          pattern: "clientCredentialsSecretRef\\.__namespace__ == 'NAMESPACE'\\)"
        documentIndex: 0
      - matchRegex:
          path: spec.variables[2].expression
          pattern: "size\\(variables\\.generatedClientPrefix\\) \\+ 5 && .*\\.matches\\('\\^\\[a-z0-9\\]\\{5\\}\\$'\\)$"
        documentIndex: 0
      - matchRegex:
          path: spec.variables[3].expression
          pattern: "authorizationServer\\.clientCredentialsSecretRef\\) &&\\s+!variables\\.generatedClientRef \\?"
        documentIndex: 0
      - notMatchRegex:
          path: spec.variables[3].expression
          pattern: "tokenExchange\\.clientCredentialsSecretRef\\) &&\\s+!variables\\.generatedClientRef"
        documentIndex: 0

  - it: names muster's namespace in the exemption
    set:
      muster.namespace: mcp-servers
    asserts:
      - matchRegex:
          path: spec.variables[2].expression
          pattern: "^string\\(request\\.namespace\\) == 'mcp-servers' &&"
        documentIndex: 0

  - it: renders nothing when disabled
    set:
      mcpServerSecretReferences.enabled: false
    asserts:
      - hasDocuments:
          count: 0
