          status:
            description: |-
              MCPServerStatus defines the observed state of MCPServer.

              This status reflects server-side observable state including auth requirements.
              It captures infrastructure connectivity as well as whether the server demands
              authentication (e.g. "Auth Required"). Per-user session state (which specific
              user is authenticated, token expiry, etc.) is tracked separately in the
              Session Registry (internal/aggregator/session_registry.go).

              Server-Side State (CRD):
                - State: Running/Connected/Starting/Connecting/Stopped/Disconnected/Auth Required/Awaiting Session/Failed
                - Conditions: Standard K8s conditions for detailed status

              Per-User Session State (Session Registry):
                - ConnectionStatus: Connected, PendingAuth, Failed (per-user)
                - AuthStatus: Authenticated, AuthRequired, TokenExpired (per-user)
                - AvailableTools: Tools visible to this specific user
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the MCPServer's current state.
                  Standard condition types:
                    - Ready: True while the server is reachable (Running, Connected, Auth
                      Required, Awaiting Session), False otherwise. The reason is the state
                      in one word (Connected, AwaitingSession, AuthRequired, Connecting,
                      Disconnected, Suspended, Failed) or, for a server Failed by its token
                      exchange, the class of the failure (TokenExchangeCredentials,
                      TokenExchangeEndpoint, TokenExchangeConnector). The message explains
                      the state: for Awaiting Session the per-session mechanism, the token
                      endpoint and connector, and when the last exchange succeeded; for
                      Failed the error.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveFailures:
                description: |-
                  ConsecutiveFailures tracks the number of consecutive connection failures.
                  This is used for exponential backoff and to identify unreachable servers.
                  Reset to 0 when a connection succeeds.
                type: integer
              icon:
                description: |-
                  Icon is the icon the server declares in its initialize result,
                  otherwise a built-in brand icon when spec.url is on a known brand
                  domain, or is in-cluster and names a known brand as service,
                  namespace or first path segment. It is a data: URI (data:<mime>;base64,...) of type
                  image/svg+xml, image/png, image/jpeg or image/webp; the whole data: URI
                  is at most 65536 characters. SVG icons are sanitised (allowlist) before
                  they are stored. Absent when there is neither.
                  Render only as an image (e.g. <img src>); never inline the markup.
                maxLength: 65536
                pattern: ^data:image/(svg\+xml|png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$
                type: string
              lastAttempt:
                description: |-
                  LastAttempt indicates when the last connection attempt was made.
                  Used with ConsecutiveFailures to implement exponential backoff.
                format: date-time
                type: string
              lastConnected:
                description: LastConnected indicates when the server was last successfully
                  connected
                format: date-time
                type: string
              lastError:
                description: |-
                  LastError contains any error message from the most recent server operation.
                  Note: Per-user authentication errors are tracked in the Session Registry,
                  not here. This field only contains infrastructure-level errors.
                type: string
              lastFailureHTTPStatus:
                description: |-
                  LastFailureHTTPStatus is the HTTP status code the endpoint answered the
                  most recent failed connection attempt with, for example 504 from a
                  gateway in front of the server or 404 from a backend whose route is
                  not served yet. Absent when the attempt got no HTTP response at all
                  (connection refused, DNS failure, timeout) or the last attempt
                  succeeded. Together with LastError it tells an upstream outage from an
                  endpoint nothing listens on.
                type: integer
              lastRestartedAt:
                description: |-
                  LastRestartedAt mirrors the spec.restartRequestedAt value most recently
                  processed by the reconciler. A restart is performed only when the two
                  differ (spec-is-desired / status-is-observed idiom, issue #1055).
                format: date-time
                type: string
              nextRetryAfter:
                description: |-
                  NextRetryAfter indicates the earliest time when the next retry should be attempted.
                  The wait doubles with every consecutive failure, starting at 30 seconds,
                  and is capped (2 minutes by default) so a recovered upstream is noticed
                  within the cap plus the retry tick, however long the outage lasted.
                  Absent while no retry is scheduled.
                format: date-time
                type: string
              restartCount:
                description: RestartCount tracks how many times this server has been
                  restarted (stdio only)
                type: integer
              state:
                description: |-
                  State represents the high-level infrastructure state of the MCP server.
                  This is independent of user session state (authentication, connection status).

                  For stdio servers: Running, Starting, Stopped, Failed
                  For remote servers: Connected, Auth Required, Awaiting Session, Connecting, Disconnected, Failed
                enum:
                - Running
                - Starting
                - Stopped
                - Connected
                - Auth Required
                - Awaiting Session
                - Connecting
                - Disconnected
                - Failed
                type: string
            type: object
