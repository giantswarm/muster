---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: mcpservers.muster.giantswarm.io
spec:
  group: muster.giantswarm.io
  names:
    kind: MCPServer
    listKind: MCPServerList
    plural: mcpservers
    shortNames:
    - mcps
    singular: mcpserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .spec.autoStart
      name: AutoStart
      type: boolean
    - jsonPath: .status.state
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MCPServer is the Schema for the mcpservers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MCPServerSpec defines the desired state of MCPServer
            properties:
              approval:
                description: |-
                  Approval sets, per tool of this server, whether a call runs (Allow),
                  asks a person first (Ask) or is hidden and refused (Block). It is set
                  by the server's connector admins: whoever may update MCPServers in its
                  namespace.

                  Unset, every tool is Allow and reported as not reviewed. There is
                  deliberately no default: a default would be applied to existing objects
                  on read and change what they allow.
                properties:
                  rule:
                    description: |-
                      Rule is what a tool without its own entry in Tools gets, a tool the
                      server adds later included: Allow or Ask. Unset, such a tool is Allow.
                    type: string
                    x-kubernetes-validations:
                    - message: rule must be Allow or Ask
                      rule: self in ['Allow', 'Ask']
                  tools:
                    additionalProperties:
                      type: string
                    description: |-
                      Tools maps a tool's own name, as the server lists it (without
                      spec.toolPrefix, the family name or muster's x_ prefix), to Allow, Ask
                      or Block. An entry wins over Rule.
                    maxProperties: 512
                    type: object
                    x-kubernetes-validations:
                    - message: a tool's setting must be Allow, Ask or Block
                      rule: self.all(k, self[k] in ['Allow', 'Ask', 'Block'])
                type: object
              args:
                description: |-
                  Args specifies the command line arguments for stdio type servers.
                  This field is only available when Type is "stdio".
                items:
                  type: string
                type: array
              auth:
                description: |-
                  Auth configures authentication behavior for this MCP server.
                  This is only relevant for remote servers (streamable-http or sse).
                properties:
                  authorizationServer:
                    description: |-
                      AuthorizationServer is an opt-out for backends that don't publish RFC 9728
                      Protected Resource Metadata. When set, muster's per-server OAuth login flow
                      (core_auth_login) skips PRM probing and uses these values directly. muster
                      logs each override use at INFO so non-compliance is observable.

                      This override does NOT bypass mcp-go's connect-time PRM probe; backends
                      without RFC 9728 metadata still reconcile to "Auth Required" on first
                      connect, then transition to "Connected" after `muster auth login`.

                      Setting AuthorizationServer does NOT change the RFC 8707 `resource`
                      parameter — that remains driven by the MCP server URL.

                      AuthorizationServer is mutually exclusive with ForwardToken: true and
                      TokenExchange.Enabled: true. The CRD admission rules above reject any
                      CR that combines them. Only valid when Type is "oauth". A server that
                      needs the session's ID token next to the pinned grant sets
                      ForwardIdentity instead.

                      Use case: Atlassian Remote MCP and similar backends that publish RFC 8414
                      metadata at their resource origin instead of via RFC 9728.
                    properties:
                      authorizationEndpoint:
                        description: |-
                          AuthorizationEndpoint is the authorization server's authorization
                          endpoint. Set it together with TokenEndpoint for an authorization server
                          that publishes no RFC 8414 / OIDC discovery document (GitHub:
                          https://github.com/login/oauth/authorize). muster then performs no
                          discovery for this issuer and assumes S256 PKCE support, which the
                          operator asserts by pinning the endpoints.
                        pattern: ^https://[^/?#]+(/[^?#]*[^/?#])?$
                        type: string
                      clientCredentialsSecretRef:
                        description: |-
                          ClientCredentialsSecretRef references a Kubernetes Secret holding a
                          client registered with this authorization server out of band (a GitHub
                          App or OAuth App). When set, muster identifies itself with these
                          credentials instead of its Client ID Metadata Document or a dynamic
                          registration -- the only option against an authorization server that
                          supports neither. The secret carries `client-id` and `client-secret`
                          (key names configurable in the reference).
                        properties:
                          clientIdKey:
                            default: client-id
                            description: |-
                              ClientIDKey is the key in the secret data that contains the client ID.
                              Defaults to "client-id" if not specified.
                            type: string
                          clientSecretKey:
                            default: client-secret
                            description: |-
                              ClientSecretKey is the key in the secret data that contains the client secret.
                              Defaults to "client-secret" if not specified.
                            type: string
                          name:
                            description: |-
                              Name is the name of the Kubernetes Secret.
                              Required.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Kubernetes namespace where the secret is located.
                              If not specified, defaults to the MCPServer's namespace. An MCPServer
                              outside muster's own namespace may name only its own namespace here;
                              muster refuses the server otherwise.
                            type: string
                        required:
                        - name
                        type: object
                      expectedIssuer:
                        description: |-
                          ExpectedIssuer is the issuer identifier the authorization server itself
                          publishes and puts in the RFC 9207 `iss` parameter of its authorization
                          responses, when that differs from Issuer. Issuer stays the identity the
                          grants are filed under; ExpectedIssuer only decides which value a
                          present `iss` on the callback has to equal. Set it when several
                          MCPServers pin one authorization server under different identities so
                          their grants stay apart -- two GitHub Apps, say: each is pinned under
                          its own identity (https://github.com/apps/<slug>) with ExpectedIssuer
                          https://github.com/login/oauth, the issuer GitHub sends. Needs
                          AuthorizationEndpoint and TokenEndpoint. Default: Issuer.
                        pattern: ^https://[^/?#]+(/[^?#]*[^/?#])?$
                        type: string
                      grantScope:
                        description: |-
                          GrantScope decides whom a token obtained from this authorization server
                          belongs to. `session` (the default) keeps today's behavior: the token is
                          bound to the login session that completed the browser flow, so every new
                          session signs in again. `subject` files the token under the user's
                          identity as well, so any later session of the same person -- another
                          client, a re-login, a front-end whose bearer rotates -- reuses the grant
                          without a new consent, until the person signs out of this server
                          (`core_auth_logout`) or everywhere. Use `subject` for external accounts
                          the person owns (GitHub), never for tokens that carry session-specific
                          authority. MCPServerAuth.GrantScope says the same for a server that
                          discovers its authorization server instead of pinning it.
                        enum:
                        - session
                        - subject
                        type: string
                      issuer:
                        description: |-
                          Issuer is the OAuth 2.0 / OIDC issuer URL of the authorization server
                          the sign-in runs against, and the identity the session's grants are
                          filed under. It takes precedence over the authorization server the
                          endpoint's own RFC 9728 metadata names: the browser flow, the token
                          store, the connection and core_auth_logout all use this issuer, so an
                          endpoint that accepts tokens from an authorization server other than the
                          one it advertises is pinned by naming the accepting one here. It may be
                          muster's own identity provider; muster keeps the session's login token
                          apart from the grant. A change to this field takes effect on the next
                          core_auth_login, without a restart.
                          muster fetches AS metadata via the existing OAuth client, which performs
                          RFC 8414 / OIDC discovery against this issuer -- unless
                          AuthorizationEndpoint and TokenEndpoint are set, in which case no
                          discovery happens and the issuer is only that identity. When the
                          authorization server publishes a different issuer identifier than the
                          identity pinned here, set ExpectedIssuer.
                        pattern: ^https://[^/?#]+(/[^?#]*[^/?#])?$
                        type: string
                      revocationEndpoint:
                        description: |-
                          RevocationEndpoint is the authorization server's RFC 7009 token
                          revocation endpoint. When the person disconnects a subject-scoped grant
                          (core_auth_logout), muster revokes its refresh and access tokens there
                          before dropping its copy, so the provider stops honouring them and the
                          next sign-in asks for consent again. Default: the revocation_endpoint
                          of the authorization server's metadata; set it for one whose metadata
                          names none or is pinned through AuthorizationEndpoint and TokenEndpoint
                          (GitLab: https://gitlab.example.com/oauth/revoke). Without either, the
                          grant stays valid at the provider until it expires.
                        pattern: ^https://[^/?#]+(/[^?#]*[^/?#])?$
                        type: string
                      scopes:
                        description: |-
                          Scopes is the OAuth scope parameter value (RFC 6749 §3.3 wire format:
                          space-separated scope tokens). Matches existing TokenExchangeConfig.Scopes.
                        type: string
                      tokenEndpoint:
                        description: |-
                          TokenEndpoint is the authorization server's token endpoint (GitHub:
                          https://github.com/login/oauth/access_token). See AuthorizationEndpoint.
                        pattern: ^https://[^/?#]+(/[^?#]*[^/?#])?$
                        type: string
                    required:
                    - issuer
                    type: object
                    x-kubernetes-validations:
                    - message: authorizationEndpoint and tokenEndpoint must be set
                        together
                      rule: has(self.authorizationEndpoint) == has(self.tokenEndpoint)
                    - message: expectedIssuer needs authorizationEndpoint and tokenEndpoint
                      rule: '!has(self.expectedIssuer) || has(self.authorizationEndpoint)'
                  forwardIdentity:
                    default: false
                    description: |-
                      ForwardIdentity sends the session's upstream ID token -- the token
                      ForwardToken would put in Authorization -- in the X-Muster-Id-Token
                      header on every request to this server, next to the grant of its pinned
                      authorization server, which Authorization keeps carrying unchanged. It
                      is for a server that acts for the person on two systems: one through the
                      pinned grant (a GitHub App user token, say) and one through calls back
                      with the person's own identity (their Kubernetes access). The token is
                      read on every request, so a refreshed one is sent once the session holds
                      it; a session without an upstream ID token sends no header, and a server
                      without this field never receives it.

                      Only valid with Type "oauth" and AuthorizationServer set. RequiredAudiences
                      of such a server are requested at login as for a ForwardToken server, so
                      the forwarded ID token carries them.

                      The forwarded ID token is not audience-scoped to this server, as with
                      ForwardToken: the same token is accepted by every backend that trusts
                      its issuer and audiences, so a ForwardIdentity server must be trusted as
                      much as a ForwardToken backend.
                    type: boolean
                  forwardToken:
                    default: false
                    description: |-
                      ForwardToken enables ID token forwarding for SSO.
                      When true, muster forwards the session's upstream dex ID token (or, for
                      sessions established by a trusted-issuer bearer, that IdP-issued bearer)
                      to this server byte-identical, instead of triggering a separate OAuth
                      flow. Every forwarded token is issued by the IdP (dex); muster is not
                      an identity provider, never signs tokens, and no backend is ever
                      configured to trust a muster JWKS. The downstream server must trust the
                      IdP's issuer/JWKS (e.g. muster's client ID in its TrustedAudiences for
                      forwarded dex ID tokens).

                      The forwarded token is not audience-scoped to this server: the same
                      token is accepted by every forwardToken backend, so all forwardToken
                      backends must be equally trusted. A token's nested act claim (minted
                      by the IdP, e.g. via exchange at dex) carries the delegation chain for
                      backend authorization decisions.
                    type: boolean
                  grantScope:
                    description: |-
                      GrantScope decides whom the grant of this server's OAuth sign-in
                      belongs to, whichever authorization server the server uses: the one
                      muster discovers through the server's RFC 9728 Protected Resource
                      Metadata, or the one pinned in AuthorizationServer. `session` (the
                      default) binds the grant to the login session that completed the
                      browser flow. `subject` files it under the person as well, so every
                      later session of the same person -- another client, an agent
                      conversation, a session after a muster restart -- connects with it
                      without a new consent, until the person signs out of the server
                      (`core_auth_logout`). The semantics are those of
                      AuthorizationServer.GrantScope, which a pinned server may set instead;
                      set both only to the same value.

                      muster decides grant scope per authorization server: a server with
                      `subject` and no pin makes the issuer it discovers subject-scoped, as a
                      pin with `grantScope: subject` does for its issuer, and the
                      one-description-per-issuer rule of the pins applies to it, except that
                      an issuer an operator names in an AuthorizationServer pin keeps that
                      pin's description. `subject` is only valid with Type "oauth" and
                      neither ForwardToken nor TokenExchange, which obtain no grant of their
                      own; `session` is accepted everywhere.
                    enum:
                    - session
                    - subject
                    type: string
                  providerApps:
                    description: |-
                      ProviderApps names the provider Apps (muster's aggregator.providerApps)
                      whose grants this server receives. On every request muster attaches the
                      access token of each named App the person granted, in the header
                      X-Muster-Grant-<app>, refreshed ahead of its expiry; an App the person
                      did not grant sends no header. A tool result that names missing Apps
                      ({"status": "grant_required", "apps": [...]} in structuredContent) is
                      answered auth_required with each App's sign-in link. The person's
                      connection is made as the person, so this needs ForwardToken or
                      ForwardIdentity.
                    items:
                      pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  requiredAudiences:
                    description: |-
                      RequiredAudiences specifies additional audience(s) that the forwarded ID token
                      should contain. When ForwardToken is true, muster will request these audiences
                      from the upstream IdP (e.g., Dex) using cross-client scopes.

                      This is used when the downstream server requires tokens with specific audiences,
                      for example when forwarding tokens to Kubernetes for OIDC authentication:
                        requiredAudiences:
                          - "dex-k8s-authenticator"

                      At user authentication, muster collects all requiredAudiences from MCPServers
                      with forwardToken: true or forwardIdentity: true and requests them all
                      from the IdP.
                    items:
                      type: string
                    type: array
                  sigv4:
                    description: |-
                      SigV4 configures AWS Signature Version 4 request signing. Required when
                      Type is "sigv4", and rejected otherwise.

                      Unlike the OAuth mechanisms above, this is a machine identity: every
                      request signs as muster itself, not as the calling user, so it never
                      touches the session-scoped client machinery. Only valid together with
                      spec.type "streamable-http".

                      ForwardToken and TokenExchange are rejected alongside it by the rule
                      above. AuthorizationServer needs no rule of its own: it already requires
                      Type "oauth", which the sigv4 pairing rule excludes.
                    properties:
                      region:
                        description: |-
                          Region is the SigV4 signing region. It must match the region in URL,
                          because the signature's credential scope is checked against the
                          endpoint. This is not the region the backend operates in — that is
                          MCPServerSpec.Meta.
                        type: string
                      roleArn:
                        description: |-
                          RoleARN, when set, is assumed from the pod's base credentials before
                          signing. Leave empty to sign as the pod's own identity.
                        type: string
                      service:
                        description: |-
                          Service is the SigV4 signing service name. It defaults to the first
                          hostname label of URL, which is how AWS's own clients derive it:
                          aws-mcp.eu-central-1.api.aws signs as service "aws-mcp".
                        type: string
                    required:
                    - region
                    type: object
                  tokenExchange:
                    description: |-
                      TokenExchange enables SSO via RFC 8693 Token Exchange for cross-cluster SSO.
                      When configured, muster exchanges its local token for a token valid on the
                      remote cluster's Identity Provider (e.g., Dex).

                      Use TokenExchange when:
                        - The remote cluster has its own Dex instance
                        - The remote Dex is configured with an OIDC connector for muster's Dex
                        - You need a token issued by the remote cluster's IdP (not just forwarded)

                      Token exchange takes precedence over ForwardToken if both are configured.
                    properties:
                      clientCredentialsSecretRef:
                        description: "ClientCredentialsSecretRef references a Kubernetes
                          Secret containing\nclient credentials for authenticating
                          with the remote Dex's token endpoint.\nThis is required
                          when the remote Dex requires client authentication for\ntoken
                          exchange (RFC 8693).\n\nThe secret should contain:\n  -
                          client-id: The OAuth client ID registered on the remote
                          Dex\n  - client-secret: The OAuth client secret for authentication\n\nExample
                          secret:\n\n\tapiVersion: v1\n\tkind: Secret\n\tmetadata:\n\t
                          \ name: grizzly-token-exchange-credentials\n\t  namespace:
                          muster\n\ttype: Opaque\n\tstringData:\n\t  client-id: muster-token-exchange\n\t
                          \ client-secret: <secret-value>"
                        properties:
                          clientIdKey:
                            default: client-id
                            description: |-
                              ClientIDKey is the key in the secret data that contains the client ID.
                              Defaults to "client-id" if not specified.
                            type: string
                          clientSecretKey:
                            default: client-secret
                            description: |-
                              ClientSecretKey is the key in the secret data that contains the client secret.
                              Defaults to "client-secret" if not specified.
                            type: string
                          name:
                            description: |-
                              Name is the name of the Kubernetes Secret.
                              Required.
                            type: string
                          namespace:
                            description: |-
                              Namespace is the Kubernetes namespace where the secret is located.
                              If not specified, defaults to the MCPServer's namespace. An MCPServer
                              outside muster's own namespace may name only its own namespace here;
                              muster refuses the server otherwise.
                            type: string
                        required:
                        - name
                        type: object
                      connectorId:
                        description: |-
                          ConnectorID is the ID of the OIDC connector on the remote Dex that
                          trusts the local cluster's Dex, sent as Dex's connector_id parameter.
                          Required for a person's exchange. A delegated caller's exchange sends
                          none: it goes to the Dex that issued the delegated token, which verifies
                          it with its own keys, so a server only delegated callers reach may leave
                          it empty.
                          Example: "cluster-a-dex"
                        pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
                        type: string
                      dexTokenEndpoint:
                        description: |-
                          DexTokenEndpoint is the URL used to connect to the remote cluster's Dex token endpoint.
                          This may differ from the issuer URL when access goes through a proxy.
                          Required when Enabled is true.
                          Example: https://dex.cluster-b.example.com/token (direct)
                          Example: https://dex-cluster.proxy.example.com/token (via proxy)
                        pattern: ^https://[^\s/$.?#].[^\s]*$
                        type: string
                      enabled:
                        default: false
                        description: Enabled determines whether token exchange should
                          be attempted.
                        type: boolean
                      expectedIssuer:
                        description: |-
                          ExpectedIssuer is the expected issuer URL in the exchanged token's "iss" claim.
                          This should match the remote Dex's configured issuer URL.
                          When access goes through a proxy, this differs from DexTokenEndpoint.
                          If not specified, the issuer is derived from DexTokenEndpoint (backward compatible).
                          Example: https://dex.cluster-b.example.com
                        pattern: ^https://[^\s/$.?#].[^\s]*$
                        type: string
                      scopes:
                        default: openid profile email groups
                        description: Scopes are the scopes to request for the exchanged
                          token.
                        type: string
                    type: object
                  type:
                    default: none
                    description: |-
                      Type specifies the authentication type.
                      Supported values:
                        - "oauth": OAuth 2.0/OIDC authentication
                        - "none": No authentication
                        - "sigv4": AWS Signature Version 4, signed with muster's own machine
                          identity. See SigV4.
                    enum:
                    - oauth
                    - none
                    - sigv4
                    type: string
                type: object
                x-kubernetes-validations:
                - message: authorizationServer is only valid when type is oauth
                  rule: '!has(self.authorizationServer) || self.type == ''oauth'''
                - message: forwardToken bypasses per-backend OAuth; set one or the
                    other, not both
                  rule: '!(has(self.forwardToken) && self.forwardToken == true &&
                    has(self.authorizationServer))'
                - message: tokenExchange has its own issuer/endpoint config; set one
                    or the other, not both
                  rule: '!(has(self.tokenExchange) && has(self.tokenExchange.enabled)
                    && self.tokenExchange.enabled == true && has(self.authorizationServer))'
                - message: type 'sigv4' requires the sigv4 block, and the sigv4 block
                    requires type 'sigv4'
                  rule: has(self.sigv4) == (self.type == 'sigv4')
                - message: sigv4 signs as muster's own machine identity, so forwardToken
                    and tokenExchange do not apply
                  rule: '!has(self.sigv4) || (self.forwardToken == false && !has(self.tokenExchange))'
                - message: forwardIdentity sends the session's ID token next to a
                    pinned grant, so it needs type oauth and authorizationServer
                  rule: '!has(self.forwardIdentity) || !self.forwardIdentity || (self.type
                    == ''oauth'' && has(self.authorizationServer))'
                - message: providerApps attaches the person's App tokens to a connection
                    made as the person, so it needs forwardToken or forwardIdentity
                  rule: '!has(self.providerApps) || size(self.providerApps) == 0 ||
                    (has(self.forwardToken) && self.forwardToken) || (has(self.forwardIdentity)
                    && self.forwardIdentity)'
                - message: grantScope subject files the grant of a per-server OAuth
                    sign-in under the person, so it needs type oauth and neither forwardToken
                    nor tokenExchange
                  rule: '!has(self.grantScope) || self.grantScope != ''subject'' ||
                    (self.type == ''oauth'' && !(has(self.forwardToken) && self.forwardToken)
                    && !(has(self.tokenExchange) && has(self.tokenExchange.enabled)
                    && self.tokenExchange.enabled))'
                - message: 'grantScope and authorizationServer.grantScope disagree:
                    set one of them, or both to the same value'
                  rule: '!has(self.grantScope) || !has(self.authorizationServer) ||
                    !has(self.authorizationServer.grantScope) || self.grantScope ==
                    self.authorizationServer.grantScope'
              autoStart:
                default: false
                description: |-
                  AutoStart determines whether this MCP server should be automatically started
                  when the muster system initializes or when dependencies become available.
                type: boolean
              command:
                description: |-
                  Command specifies the executable path for stdio type servers.
                  This field is required when Type is "stdio".
                type: string
              description:
                description: Description provides a human-readable description of
                  this MCP server's purpose.
                maxLength: 500
                type: string
              env:
                additionalProperties:
                  type: string
                description: |-
                  Env contains environment variables to set for a stdio server's process
                  when it is started. Only allowed when Type is "stdio": a remote server
                  has no process to receive them. A remote server that needs a credential
                  reads it from a Secret through HeadersFrom.
                type: object
              family:
                description: |-
                  Family declares that this MCP server is an instance of a family of
                  equivalent servers (for example, multiple kubernetes MCP servers pointed
                  at different clusters). When set, the aggregator exposes tools from all
                  servers in the same family under a single name
                  ({musterPrefix}_{family.name}_{toolName}) with a required parameter
                  (named by family.instanceArg) that selects which instance handles the
                  call. The parameter is always required even for single-instance families
                  so skills written against the family name remain stable as instances are
                  added or removed. When unset, the legacy per-server prefixing applies
                  ({musterPrefix}_{toolPrefix-or-name}_{toolName}).
                properties:
                  instanceArg:
                    description: |-
                      InstanceArg names the required parameter callers use to select which
                      family member handles the tool call (for example "management_cluster",
                      "country", "model"). All servers declaring the same family.name must
                      agree on InstanceArg; if they diverge, the aggregator falls back to
                      per-server prefixing for the entire family and logs a warning.
                    pattern: ^[a-zA-Z][a-zA-Z0-9_]*$
                    type: string
                  name:
                    description: |-
                      Name is the family identifier. Servers sharing the same Name expose
                      their tools as {musterPrefix}_{Name}_{toolName}.
                    pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
                    type: string
                required:
                - instanceArg
                - name
                type: object
              headers:
                additionalProperties:
                  type: string
                description: |-
                  Headers contains HTTP headers to send with requests to remote MCP servers.
                  This field is only relevant when Type is "streamable-http" or "sse".

                  Everyone who can read the MCPServer can read these values, so they hold
                  no credential: a value in an Authorization, Proxy-Authorization, Cookie
                  or X-API-Key header (in any case) is refused. Send a credential with
                  HeadersFrom instead.
                maxProperties: 32
                type: object
                x-kubernetes-validations:
                - message: 'headers must not hold a credential (Authorization, Proxy-Authorization,
                    Cookie, X-API-Key): put it in a Secret and refer to it in headersFrom'
                  rule: self.all(k, self[k] == '' || !k.matches('^(?i)(authorization|proxy-authorization|cookie|x-api-key)$'))
              headersFrom:
                description: |-
                  HeadersFrom lists HTTP headers whose values muster reads from a Secret
                  in the MCPServer's own namespace, each time it connects to the server.
                  It is the place for a credential such as an Authorization header: the
                  value never enters the MCPServer, muster's service data or the output
                  of a core tool. An entry wins over a Headers entry of the same name.
                  Only relevant when Type is "streamable-http" or "sse".

                  A connection that carries a person's own credential (an OAuth sign-in,
                  a forwarded or exchanged token) sends its own Authorization header, so
                  an Authorization entry here reaches only muster's own connection.

                  Header names are case-insensitive, so two entries whose names differ
                  only in case are refused.
                items:
                  description: |-
                    MCPServerHeaderFrom is an HTTP header whose value muster reads from a
                    Secret, in the shape of kagent's RemoteMCPServer headersFrom.
                  properties:
                    name:
